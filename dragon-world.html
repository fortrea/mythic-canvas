<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dragon World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed world canvas; HUD hugs the corners — title + clock top-left, census top-right,
   info card right, event ticker bottom-left, minimap bottom-centre. One committed dark, ancient look. */
:root{
  --ink:#efe6d2;--muted:#b3a88f;--panel:rgba(16,13,14,.74);--line:rgba(236,210,150,.22);--gold:#d9b45a;--ember:#ff7a3c;
  --display:"Cinzel","Trajan Pro",Georgia,serif;--text:"Alegreya Sans","Gill Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#07070b;color:var(--ink);font:15px/1.45 var(--text);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.hud{position:fixed;z-index:2;pointer-events:none}
.top{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.brand h1{margin:0;font:700 clamp(22px,3.2vw,34px)/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.8)}
.brand p{margin:6px 0 0;font:400 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.9)}
#census{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:560px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font:400 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);backdrop-filter:blur(6px)}
.chip i{width:8px;height:8px;border-radius:50%}.chip b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
#card{position:fixed;z-index:3;right:max(16px,env(safe-area-inset-right,0px));top:calc(132px + env(safe-area-inset-top,0px));max-height:calc(100vh - 230px);overflow:auto;width:min(320px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px}
.card-head{display:flex;gap:12px;align-items:center}
.card-head>div{flex:1;min-width:0}
.card-head h2{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.06em;overflow-wrap:anywhere}
.sub{margin:3px 0 0;color:var(--muted);font-size:13px}
.swatch{width:22px;height:22px;border-radius:50%;flex:none}.swatch.nest{background:radial-gradient(circle at 40% 35%,#e9d3a3,#7a5a36)}
.x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--ink)}
.status{margin:0;color:var(--gold);font-style:italic}
.badges{margin:0;display:flex;gap:6px;flex-wrap:wrap}.badges span{font:400 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border:1px solid;border-radius:999px}
.desc{margin:0;color:var(--ink);font-size:14px}
#card.royal{border-color:rgba(255,226,150,.7);box-shadow:0 0 0 1px rgba(255,226,150,.25),0 0 60px rgba(255,214,130,.25),0 20px 50px rgba(0,0,0,.5);background:linear-gradient(160deg,rgba(60,48,24,.82),rgba(16,13,14,.82))}
#card.royal h2{color:#fff1c4;text-shadow:0 0 14px rgba(255,214,130,.6)}
#track{top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;pointer-events:auto;position:fixed}
#track button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);min-width:0;backdrop-filter:blur(6px)}
#track button b{font:600 11px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track button span{font:400 10px/1.2 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#track button.on{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
#track button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#trackMark{position:absolute;bottom:-6px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--gold);border-radius:2px;transition:left .2s}
#banner{position:fixed;z-index:2;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .8s;font:700 clamp(26px,5vw,56px)/1.05 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--c,#efe6d2);text-shadow:0 0 30px rgba(0,0,0,.9),0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}
#banner small{display:block;font:400 12px/1.4 var(--mono);letter-spacing:.3em;color:var(--ink);opacity:.8}
#banner.show{opacity:1}
.chip.king i{background:radial-gradient(circle,#fff6d8,#e8c46a)}.chip.king{border-color:rgba(255,226,150,.5)}
@media (max-width:760px){#track button span{display:none}#card{top:calc(150px + env(safe-area-inset-top,0px))}}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex:1}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ember))}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}dt{color:var(--muted)}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.egg{display:flex;align-items:center;gap:10px;font:400 12px/1 var(--mono);color:var(--muted)}
.muted{margin:0;color:var(--muted)}
.actions{display:flex;gap:8px}
.actions button{flex:1;font:600 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(217,180,90,.12);border:1px solid var(--line);border-radius:8px;padding:10px 8px;cursor:pointer}
.actions button:hover{background:rgba(217,180,90,.24);border-color:rgba(236,210,150,.5)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#ticker{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100vw - 32px));display:flex;flex-direction:column;gap:2px}
#ticker p{margin:0;font-size:14px;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.95)}
.bottom{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:auto}
#mini{width:min(360px,calc(100vw - 32px));height:62px;border-radius:8px;border:1px solid var(--line);cursor:pointer;display:block}
.hint{margin:0;font:400 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 4px #000}
@media (max-width:760px){#ticker{bottom:calc(110px + env(safe-area-inset-bottom,0px))}#census{max-width:100%;justify-content:flex-start}}
</style>
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>

<canvas id="world" aria-label="A living world of dragons that rises from the ashen wilds to the dragons' Olympus, ruled by the Dragon King"></canvas>
<div class="hud top">
  <div class="brand"><h1>Dragon World</h1><p id="clock">Day 1</p></div>
  <div id="census"></div>
</div>
<nav class="hud" id="track" aria-label="The five realms, from common to the Dragon King"></nav>
<div id="banner" aria-live="polite"></div>
<aside id="card" hidden></aside>
<div class="hud" id="ticker" aria-live="polite"></div>
<div class="hud bottom">
  <canvas id="mini" aria-label="World map: click to travel"></canvas>
  <p class="hint">Drag to explore · scroll or pinch to zoom · click a dragon or nest</p>
</div>

<script>
'use strict';
// ===================== Dragon World — core: canvas, camera, input, helpers, sky =====================
const cv=document.getElementById('world'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1;
const WORLD_W=7600,WORLD_H=1000;                     // world units; ground sits around y 820-900
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`,rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade=(c,t)=>t<0?mix(c,[0,0,0],-t):mix(c,[255,255,255],t);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(Date.now()%100000);                      // runtime randomness (behaviour)
const pick=a=>a[Math.floor(R()*a.length)];
function noise1(x,seed=0){                          // smooth 1D value noise in [-1,1]
  const i=Math.floor(x),f=x-i,h=n=>{const s=Math.sin((n+seed*57.3)*127.1)*43758.5453;return(s-Math.floor(s))*2-1};
  const u=f*f*(3-2*f);return lerp(h(i),h(i+1),u);
}

// ---------- camera: world units → screen pixels ----------
const cam={x:1000,y:0,zoom:1,follow:null};
const baseScale=()=>H/WORLD_H;
const camScale=()=>baseScale()*cam.zoom;
const viewW=()=>W/camScale(),viewH=()=>H/camScale();
function clampCam(){cam.zoom=clamp(cam.zoom,1,2.6);cam.x=clamp(cam.x,0,WORLD_W-viewW());cam.y=clamp(cam.y,0,WORLD_H-viewH())}
const toWorld=(sx,sy)=>({x:cam.x+sx/camScale(),y:cam.y+sy/camScale()});
const toScreen=(wx,wy)=>({x:(wx-cam.x)*camScale(),y:(wy-cam.y)*camScale()});
function worldTransform(par=1){const s=camScale();ctx.setTransform(s*DPR,0,0,s*DPR,-cam.x*par*s*DPR,-cam.y*s*DPR)}
function screenTransform(){ctx.setTransform(DPR,0,0,DPR,0,0)}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;clampCam()}
addEventListener('resize',resize);resize();
cam.x=0;                                              // the journey starts at the far left, among the commoners

// ---------- input: drag to pan, wheel / pinch to zoom, keys, click ----------
const mouse={x:-1e4,y:-1e4,wx:-1e4,wy:-1e4,inside:false};
const pointers=new Map();let dragStart=null,pinch0=null,moved=0;
const onClickHandlers=[];
function zoomAt(sx,sy,f){const before=toWorld(sx,sy);cam.zoom*=f;clampCam();const after=toWorld(sx,sy);cam.x+=before.x-after.x;cam.y+=before.y-after.y;clampCam()}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(pointers.size===1)dragStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.zoom}}});
cv.addEventListener('pointermove',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.inside=true;
  if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinch0){const [a,b]=[...pointers.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    const f=pinch0.z*d/pinch0.d/cam.zoom;zoomAt((a.x+b.x)/2,(a.y+b.y)/2,f);moved=99;return}
  if(dragStart){const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;moved=Math.max(moved,Math.hypot(dx,dy));
    if(moved>5){cam.follow=null;cam.x=dragStart.cx-dx/camScale();cam.y=dragStart.cy-dy/camScale();clampCam();cv.style.cursor='grabbing'}}});
const endPointer=e=>{if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);
  if(pointers.size===0){if(moved<=5&&dragStart){const w=toWorld(e.clientX,e.clientY);onClickHandlers.forEach(f=>f(w.x,w.y))}dragStart=null;pinch0=null;cv.style.cursor=''}
  if(pointers.size===1){const p=[...pointers.values()][0];dragStart={x:p.x,y:p.y,cx:cam.x,cy:cam.y};pinch0=null}};
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',()=>{mouse.inside=false});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015))},{passive:false});
const keys=new Set();
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button'))return;keys.add(e.key.toLowerCase());
  if(e.key==='+'||e.key==='=')zoomAt(W/2,H/2,1.15);if(e.key==='-')zoomAt(W/2,H/2,1/1.15)});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function updateCamera(dt){
  const sp=900*dt/1000/cam.zoom;
  if(keys.has('arrowleft')||keys.has('a')){cam.x-=sp;cam.follow=null}
  if(keys.has('arrowright')||keys.has('d')){cam.x+=sp;cam.follow=null}
  if(keys.has('arrowup')||keys.has('w')){cam.y-=sp;cam.follow=null}
  if(keys.has('arrowdown')||keys.has('s')){cam.y+=sp;cam.follow=null}
  if(cam.follow){const f=cam.follow;if(!f.alive){cam.follow=null}else{
    cam.x=lerp(cam.x,f.x-viewW()/2,.06);cam.y=lerp(cam.y,f.y-viewH()*.55,.06)}}
  clampCam();
  const w=toWorld(mouse.x,mouse.y);mouse.wx=w.x;mouse.wy=w.y;
}

// ---------- sky: a slow, dark and dramatic day ----------
const DAY_SECONDS=240,START_HOUR=17.2;
const KEYS=[ // hour, top, horizon, light, stars
  [0,[5,6,14],[24,20,34],.1,1],[4.8,[5,6,14],[24,20,34],.1,1],
  [5.8,[28,30,58],[150,86,84],.28,.5],[6.8,[58,70,104],[214,140,96],.5,.1],
  [9,[74,94,124],[176,170,160],.78,0],[13,[78,104,138],[168,180,184],.9,0],
  [16.5,[70,86,118],[196,164,128],.8,0],[18,[66,58,92],[226,120,72],.6,0],
  [19,[34,28,58],[150,60,62],.34,.35],[20.4,[8,9,20],[34,24,40],.12,.9],[24,[5,6,14],[24,20,34],.1,1]];
const PHASES=[[0,'Night'],[5,'Dawn'],[6.4,'Sunrise'],[8,'Morning'],[11,'Midday'],[14,'Afternoon'],[17,'Golden hour'],[18.4,'Sunset'],[19.3,'Dusk'],[20.5,'Night']];
const SKY={hour:START_HOUR,top:[0,0,0],hor:[0,0,0],light:1,stars:0,night:0,day:0};
const T0=performance.now();
function skyAt(now){
  const total=START_HOUR+(now-T0)/1000/DAY_SECONDS*24,h=total%24;SKY.day=Math.floor(total/24)+1;
  let i=0;while(KEYS[i+1][0]<=h)i++;
  const a=KEYS[i],b=KEYS[i+1],f=(h-a[0])/(b[0]-a[0]),e=f*f*(3-2*f);
  SKY.hour=h;SKY.top=mix(a[1],b[1],e);SKY.hor=mix(a[2],b[2],e);SKY.light=lerp(a[3],b[3],e);SKY.stars=lerp(a[4],b[4],e);
  SKY.night=clamp((.55-SKY.light)/.42,0,1);
  const hv=heavenAt(cam.x+viewW()/2);SKY.heaven=hv;
  const hTop=mix([28,20,70],[104,146,232],SKY.light),hHor=mix([104,72,156],[255,228,176],SKY.light);
  SKY.top=mix(SKY.top,hTop,hv*.72);SKY.hor=mix(SKY.hor,hHor,hv*.78);
  SKY.light=lerp(SKY.light,Math.max(SKY.light,.32),hv*.6);SKY.night=clamp((.55-SKY.light)/.42,0,1);SKY.stars=lerp(SKY.stars,Math.min(1,SKY.stars*1.3+.05),hv);
}
const smooth01=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const heavenAt=x=>smooth01((x-1400)/(7000-1400));
const skyStars=Array.from({length:240},()=>({x:R(),y:R()*.75,r:R()*1.2+.2,p:R()*7}));
const memorialStars=[];                              // stars left by dragons that ascended
const stormClouds=Array.from({length:14},()=>({x:R()*1.6,y:.04+R()*.4,s:.7+R()*1.3,v:(4+R()*8)*1e-6*(R()<.5?1:-1),
  puffs:Array.from({length:7},(_,j)=>[(j-3)*36+R()*20,(R()-.5)*18,34+R()*26,16+R()*12])}));
function drawSky(now){
  screenTransform();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(SKY.top));g.addColorStop(.6,rgb(mix(SKY.top,SKY.hor,.6)));g.addColorStop(1,rgb(SKY.hor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const px=cam.x*camScale()*.04;                    // stars and sky drift very slightly with the camera
  if(SKY.stars>.01)for(const s of skyStars){const tw=reduce?.7:.35+.65*Math.abs(Math.sin(now/1400+s.p));
    ctx.fillStyle=`rgba(225,232,255,${tw*.85*SKY.stars})`;ctx.beginPath();ctx.arc(((s.x*W-px)%W+W)%W,s.y*H,s.r,0,TAU);ctx.fill()}
  for(const s of memorialStars){const tw=reduce?.7:.5+.5*Math.abs(Math.sin(now/1300+s.p)),gr=Math.min(1,(now-s.born)/1500),x=((s.x*W-px)%W+W)%W,y=s.y*H,v=.35+.65*SKY.stars,Rr=s.r*6*gr;
    const rg=ctx.createRadialGradient(x,y,0,x,y,Rr);rg.addColorStop(0,`rgba(${s.c},${.55*tw*v})`);rg.addColorStop(1,`rgba(${s.c},0)`);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,Rr,0,TAU);ctx.fill();ctx.fillStyle=`rgba(255,255,255,${(.6+.4*tw)*v})`;ctx.beginPath();ctx.arc(x,y,s.r*gr,0,TAU);ctx.fill()}
  // sun and moon
  const S=Math.min(W,H),sp=(SKY.hour-5.9)/12.9;
  if(sp>-.06&&sp<1.06){const hi=Math.sin(clamp(sp,0,1)*Math.PI),x=W*(.08+.84*sp),y=H*(.82-.62*hi),c=mix([255,110,50],[255,236,200],Math.min(1,hi*1.5)),Rr=S*.45;
    const sg=ctx.createRadialGradient(x,y,0,x,y,Rr);sg.addColorStop(0,rgba(c,.45));sg.addColorStop(.1,rgba(c,.2));sg.addColorStop(1,rgba(c,0));
    ctx.fillStyle=sg;ctx.fillRect(x-Rr,y-Rr,Rr*2,Rr*2);ctx.fillStyle=rgb(c);ctx.beginPath();ctx.arc(x,y,S*.03,0,TAU);ctx.fill()}
  const mp=((SKY.hour-18.8+24)%24)/11;
  if(mp<1.04){const hi=Math.sin(clamp(mp,0,1)*Math.PI),x=W*(.12+.76*mp),y=H*(.76-.56*hi),r=S*.032,Rr=S*.25;
    const mg=ctx.createRadialGradient(x,y,0,x,y,Rr);mg.addColorStop(0,`rgba(200,215,255,${.2*SKY.stars+.04})`);mg.addColorStop(1,'rgba(200,215,255,0)');
    ctx.fillStyle=mg;ctx.fillRect(x-Rr,y-Rr,Rr*2,Rr*2);ctx.fillStyle='#e8eaf4';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(140,150,180,.35)';for(const [dx,dy,rr] of [[-.3,-.2,.22],[.25,.3,.16],[.1,-.45,.1]]){ctx.beginPath();ctx.arc(x+dx*r,y+dy*r,rr*r,0,TAU);ctx.fill()}}
  // heavy storm clouds, lit by the horizon at dawn and dusk
  const warm=1-Math.min(1,Math.abs(SKY.light-.5)*2.4),cc=mix(mix(mix([22,24,36],[150,156,170],SKY.light),SKY.hor,.2+.35*warm),mix([120,100,170],[255,244,220],SKY.light),SKY.heaven*.7);
  for(const c of stormClouds){const x=((c.x+now*c.v)%1.6+1.6)%1.6*W-W*.3-px*.5,y=c.y*H;
    for(const [dx,dy,rx,ry] of c.puffs){ctx.fillStyle=rgba(shade(cc,dy<0?.08:-.12),.62);ctx.beginPath();ctx.ellipse(x+dx*c.s,y+dy*c.s,rx*c.s,ry*c.s,0,0,TAU);ctx.fill()}}
}

const motesH=Array.from({length:90},()=>({x:R(),y:R(),s:.3+R(),p:R()*TAU}));
function drawHeavenFx(now){
  const hv=SKY.heaven;if(hv<.02)return;screenTransform();
  ctx.globalCompositeOperation='lighter';
  // god rays falling from above

// ===================== Terrain: a valley that rises from the ashen wilds to the dragons' Olympus =====================
// Five caste zones from left to right. Rock turns from ash to basalt to stone to marble to white gold,
// ruins turn into colonnades, temples and finally the King's palace.
const ZONES=[
  {tier:0,name:'Ashen Wilds',caste:'Common',x0:0,x1:1600},
  {tier:1,name:'Ember Highlands',caste:'Middle',x0:1600,x1:3250},
  {tier:2,name:'Gilded Spires',caste:'High',x0:3250,x1:4750},
  {tier:3,name:'Celestial Terraces',caste:'Emperor',x0:4750,x1:6250},
  {tier:4,name:'Mount Olympus',caste:'The Dragon King',x0:6250,x1:7600}];
const zoneAt=x=>ZONES.find(z=>x<z.x1)||ZONES[4];
const STEP=4,NS=Math.ceil(WORLD_W/STEP)+2,SURF=new Float32Array(NS);
const MOUNTAINS=[
  {name:'Barrow Hill',cx:620,peak:705,half:330,exp:1.6,seed:6},
  {name:'Grim Crag',cx:1330,peak:520,half:260,exp:1.2,seed:9},
  {name:'Great Peak',cx:2100,peak:210,half:520,exp:1.25,seed:1,snow:1},
  {name:'Ashmaw Volcano',cx:2880,peak:330,half:470,exp:1.1,seed:2,crater:.12,volcano:1},
  {name:'North Spire',cx:3660,peak:190,half:170,exp:1.05,seed:3,snow:1},
  {name:'South Spire',cx:3950,peak:280,half:180,exp:1.05,seed:4,snow:1},
  {name:'Colonnade Plateau',cx:4420,peak:560,half:300,exp:.7,seed:5,mesa:.6},
  {name:'Terrace Mount',cx:5450,peak:330,half:620,exp:1,seed:10,terraces:5},
  {name:'Mount Olympus',cx:6950,peak:430,half:720,exp:1.05,seed:12,terraces:7,olympus:1}];
const VOLCANO=MOUNTAINS[3],OLYMPUS=MOUNTAINS[8];
const groundY=x=>872+noise1(x/260,11)*22+noise1(x/70,12)*6-heavenAt(x)*30;
function mountainY(m,x){
  const t=Math.abs(x-m.cx)/m.half;if(t>=1)return 1e9;
  if(m.crater&&t<m.crater)return m.peak+12-Math.cos(t/m.crater*Math.PI/2)*14;
  let tt=t;if(m.mesa)tt=Math.max(0,(t-m.mesa)/(1-m.mesa));
  const base=groundY(x);let y=m.peak+(base-m.peak)*Math.pow(tt,m.exp);
  if(m.terraces){const step=(base-m.peak)/m.terraces;y=m.peak+Math.floor((y-m.peak)/step+.35)*step*.92+((y-m.peak)%step)*.08;if(m.olympus&&t<.06)y=m.peak}

for(let i=0;i<NS;i++){const x=i*STEP;let y=groundY(x);for(const m of MOUNTAINS)y=Math.min(y,mountainY(m,x));SURF[i]=y}
const surf=x=>{const f=clamp(x/STEP,0,NS-2),i=Math.floor(f);return lerp(SURF[i],SURF[i+1],f-i)};

// ---------- perches and nests (each one belongs to the caste of its zone) ----------
const PERCHES=[],NESTS=[];
function flatten(x,half,y){for(let i=Math.floor((x-half)/STEP);i<=Math.ceil((x+half)/STEP);i++)if(i>=0&&i<NS)SURF[i]=Math.min(SURF[i],y)}
function addPerch(name,x,y,type,opts={}){const p={id:PERCHES.length,name,x,y,type,holder:null,tier:zoneAt(x).tier,...opts};PERCHES.push(p);return p}
function addNest(perch){const n={id:NESTS.length,name:perch.name,x:perch.x,y:perch.y,perch,owner:null,eggs:[],tier:perch.tier};perch.nest=n;NESTS.push(n);return n}
for(const [mi,side,t,nest] of [[1,1,.45,1],[2,-1,.38,1],[2,1,.52,1],[2,1,.22,0],[3,-1,.42,1],[3,1,.5,1],[4,1,.45,1],[5,-1,.5,0]]){

for(const p of PERCHES)if(p.type==='hill'){flatten(p.x,22,surf(p.x));p.y=surf(p.x)}

  addNest(PERCHES.find(p=>p.name==='Olympus West Shrine I'));addNest(PERCHES.find(p=>p.name==='Olympus East Shrine I'));

// ---------- pre-built shapes ----------
let terrainPath,strataPath,goldVeins,snowPath,lavaPaths=[],trees=[],farRange,midRange,fgPath,fgTrees,facetLight,facetDark,mossPath,lightFalls=[];
function buildTerrain(){
  const r=rng(4242);
  terrainPath=new Path2D();terrainPath.moveTo(-20,WORLD_H+20);for(let i=0;i<NS;i++)terrainPath.lineTo(i*STEP,SURF[i]);terrainPath.lineTo(WORLD_W+20,WORLD_H+20);terrainPath.closePath();
  strataPath=new Path2D();goldVeins=new Path2D();
  for(let k=0;k<720;k++){const x=r()*WORLD_W,y=surf(x)+10+r()*180;if(y>870)continue;const a=(r()-.5)*1.2+(r()<.5?.6:-.6),L=12+r()*40,p=x>4600&&r()<.6?goldVeins:strataPath;
    p.moveTo(x,y);p.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L*.4+L*.3)}
  facetLight=new Path2D();facetDark=new Path2D();mossPath=new Path2D();
  for(let k=0;k<900;k++){const x=r()*WORLD_W,y0=surf(x);if(y0>850)continue;const y=y0+r()*Math.min(260,(880-y0)),w=14+r()*46,h=10+r()*36,sl=surf(x+6)-surf(x-6);
    const p=sl<0?facetLight:facetDark;p.moveTo(x,y);p.lineTo(x+w*.5,y-h*.4);p.lineTo(x+w,y+h*.2);p.lineTo(x+w*.4,y+h);p.closePath()}
  for(let x=0;x<WORLD_W;x+=6){const y=surf(x);if(y<620||y>870)continue;const h=6+r()*16;mossPath.moveTo(x-4,y+3);mossPath.lineTo(x,y-h*.3);mossPath.lineTo(x+4,y+3+h*.2);mossPath.closePath()}
  snowPath=new Path2D();
  for(const m of MOUNTAINS.filter(m=>m.snow)){const line=m.peak+95,pts=[];
    for(let x=m.cx-m.half;x<=m.cx+m.half;x+=STEP){const y=surf(x);if(y<line)pts.push([x,y])}
    if(pts.length<2)continue;snowPath.moveTo(pts[0][0],pts[0][1]);pts.forEach(p=>snowPath.lineTo(p[0],p[1]));
    for(let j=pts.length-1;j>=0;j-=3){const [x,y]=pts[j],d=(line-y)*.55+8+noise1(x/9,m.seed)*14;snowPath.lineTo(x,Math.min(line,y+d))}snowPath.closePath()}
  lavaPaths=[];
  for(const [dir,len] of [[-1,.75],[1,.55],[-1,.4]]){const p=new Path2D();let x=VOLCANO.cx+dir*VOLCANO.half*.08;p.moveTo(x,surf(x));
    for(let t=0;t<len;t+=.02){x=VOLCANO.cx+dir*VOLCANO.half*(.08+t)+noise1(t*12,dir+5)*14;p.lineTo(x,surf(x)+3)}lavaPaths.push(p)}
  // trees change with the caste: dead pines, pines, cypresses, blossom trees, golden trees
  trees=[];for(let x=0;x<WORLD_W;x+=10+r()*14){const y=surf(x);if(y<790||r()<.3)continue;trees.push({x,y:y+4,h:24+r()*46,v:r(),z:zoneAt(x).tier})}
  const ridge=(base,amp,seed,width,step)=>{const p=new Path2D();p.moveTo(-50,WORLD_H+50);
    for(let x=-50;x<=width;x+=step){const y=base-amp*(.55+.3*noise1(x/420,seed)+.18*noise1(x/120,seed+1)+.06*noise1(x/30,seed+2))-Math.max(0,noise1(x/900,seed+3))*amp*.9;p.lineTo(x,y)}
    p.lineTo(width,WORLD_H+50);p.closePath();return p};
  farRange=ridge(720,420,31,11000,14);midRange=ridge(800,330,41,11000,10);
  fgPath=new Path2D();fgTrees=[];
  for(let x=-50;x<WORLD_W*1.25+3000;x+=180+r()*260){
    if(r()<.55){const w=60+r()*140,h=40+r()*90;fgPath.moveTo(x,WORLD_H+10);fgPath.lineTo(x+w*.2,WORLD_H-h);fgPath.lineTo(x+w*.55,WORLD_H-h*1.1);fgPath.lineTo(x+w,WORLD_H+10);fgPath.closePath()}
    else fgTrees.push([x,WORLD_H+10,140+r()*110])}

  lightFalls=[-260,-120,140,300].map(dx=>{const x=OLYMPUS.cx+dx;return{x,y:surf(x),len:Math.min(300,WORLD_H-surf(x))}});
}
buildTerrain();

function pineShape(p,x,y,h,lean=0){p.moveTo(x-h*.04,y);p.lineTo(x-h*.04+lean,y-h*.25);
  for(let k=0;k<5;k++){const ty=y-h*(.22+.16*k),w=h*(.28-.045*k);p.lineTo(x-w+lean*(1+k*.2),ty);p.lineTo(x+lean*(1.1+k*.2),ty-h*.17)}
  for(let k=4;k>=0;k--){const ty=y-h*(.22+.16*k),w=h*(.28-.045*k);p.lineTo(x+w+lean*(1+k*.2),ty)}
  p.lineTo(x+h*.04+lean,y-h*.25);p.lineTo(x+h*.04,y);p.closePath()}

const layerCol=(night,day,haze)=>mix(mix(night,day,SKY.light),SKY.hor,haze*(.15+.3*(1-SKY.night)));
// rock color by caste: ash → basalt → stone → marble → white gold
const ROCK=[[[18,16,22],[70,64,68]],[[22,16,16],[84,64,58]],[[26,26,32],[128,124,120]],[[46,44,60],[200,194,182]],[[60,54,70],[240,230,204]]];
function drawBackLayers(){

  worldTransform(.5);ctx.fillStyle=rgb(layerCol([12,12,22],[66,70,90],.45));ctx.fill(midRange);

}
function drawTerrain(now){
  worldTransform(1);
  const g=ctx.createLinearGradient(0,0,WORLD_W,0);
  ZONES.forEach(z=>{const [n,d]=ROCK[z.tier],c=layerCol(n,d,.1);g.addColorStop(clamp((z.x0+z.x1)/2/WORLD_W,0,1),rgb(c))});
  ctx.fillStyle=g;ctx.fill(terrainPath);
  const vg=ctx.createLinearGradient(0,150,0,WORLD_H);vg.addColorStop(0,'rgba(255,255,255,.1)');vg.addColorStop(.45,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');

  ctx.fillStyle=rgba([0,0,0],.08);ctx.fill(facetDark);

  ctx.strokeStyle=rgba([0,0,0],.26);ctx.lineWidth=1.4;ctx.stroke(strataPath);
  ctx.strokeStyle=rgba([226,184,92],.55+.25*SKY.night);ctx.lineWidth=1.6;ctx.stroke(goldVeins);
  ctx.fillStyle=rgba(mix(mix([120,130,160],[236,240,248],SKY.light),SKY.hor,.15),.92);ctx.fill(snowPath);
  ctx.strokeStyle=rgba(mix(SKY.hor,[255,255,255],.2),.25+.25*(1-SKY.night));ctx.lineWidth=2.2;ctx.stroke(terrainPath);

  const cg=ctx.createRadialGradient(VOLCANO.cx,VOLCANO.peak,0,VOLCANO.cx,VOLCANO.peak,170);cg.addColorStop(0,`rgba(255,140,40,${.55*pulse})`);cg.addColorStop(1,'rgba(255,80,20,0)');
  ctx.fillStyle=cg;ctx.fillRect(VOLCANO.cx-170,VOLCANO.peak-170,340,340);
  // falls of light on Olympus
  for(const f of lightFalls){const lg=ctx.createLinearGradient(0,f.y,0,f.y+f.len);lg.addColorStop(0,'rgba(255,246,220,.85)');lg.addColorStop(1,'rgba(255,230,170,0)');
    ctx.strokeStyle=lg;ctx.lineWidth=7;ctx.setLineDash([16,10]);ctx.lineDashOffset=reduce?0:-now*.08;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x+4,f.y+f.len);ctx.stroke()}
  ctx.setLineDash([]);
  for(const s of STRUCTS)drawStruct(s,now);
  drawTrees();
}
function drawTrees(){
  const x0=cam.x-80,x1=cam.x+viewW()+80;
  const kinds=[[[8,10,10],[40,44,40]],[[8,12,10],[34,52,40]],[[8,14,12],[30,64,46]],[[30,14,30],[236,180,206]],[[40,32,12],[246,206,110]]];
  const paths=kinds.map(()=>new Path2D()),trunks=new Path2D();
  for(const t of trees){if(t.x<x0||t.x>x1)continue;
    if(t.z<=1)pineShape(paths[t.z],t.x,t.y,t.h,(t.v-.5)*4);
    else if(t.z===2){paths[2].moveTo(t.x+t.h*.12,t.y-t.h*.55);paths[2].ellipse(t.x,t.y-t.h*.55,t.h*.12,t.h*.55,0,0,TAU)}

  ctx.fillStyle=rgb(layerCol([8,6,6],[60,44,34],.05));ctx.fill(trunks);

}
function drawStruct(s,now){

// ---------- particle effects ----------
const FX=[];let shake=0;const MAX_FX=1400;
const rainbow=()=>[[255,90,90],[255,200,80],[120,255,140],[90,200,255],[200,120,255]][Math.floor(R()*5)];
function emit(type,x,y,a,c,o={}){
  if(FX.length>MAX_FX)return;
  const sp=o.v??5,s=a+(R()-.5)*(o.spread??.3)*2,col=c==='rainbow'?rainbow():c;
  const p={t:type,x,y,vx:Math.cos(s)*sp*(.75+R()*.5),vy:Math.sin(s)*sp*(.75+R()*.5),life:1,max:o.life??600,size:o.size??4,c:col,g:o.g??0,rot:R()*TAU,vr:(R()-.5)*.3,a:s,k:o.k??1};
  if(type==='bolt'){const L=(o.size??200)*p.k,n=9;p.pts=[];for(let i=0;i<=n;i++){const t=i/n,off=(i&&i<n)?(R()-.5)*30*p.k:0;p.pts.push([x+Math.cos(a)*L*t-Math.sin(a)*off,y+Math.sin(a)*L*t+Math.cos(a)*off])}p.vx=p.vy=0}
  if(type==='beam'||type==='ring'||type==='glyph'||type==='void'||type==='pillar'){p.vx*=type==='void'||type==='glyph'?1:0;p.vy*=type==='void'||type==='glyph'?1:0}
  if(type==='wisp')p.trail=[];
  FX.push(p);return p;
}
function breathe(d){
  if(!d.mouthW)return;const el=ELEMENTS[d.element],k=d.k;
  const a=d.headAngleW??0;d.breathF=(d.breathF||0)+1;
  for(const [type,c,n,v,spread,life,g,size,every] of el.breath){
    if(every&&d.breathF%every)continue;
    for(let i=0;i<n;i++){const p=emit(type,d.mouthW.x,d.mouthW.y,a,c,{v:v*Math.sqrt(k),spread,life,g,size:size*(type==='bolt'?1:Math.sqrt(k)),k});
      if(p&&type==='beam'){p.len=(d.king?900:420)*Math.sqrt(k);p.follow=d}}
  }
}
function roarBurst(d){                                // the visible shockwave of a roar
  const c=ELEMENTS[d.element].glow,h=d.headW||V(d.x,d.y),n=d.king?4:d.tier>=3?2:1;
  for(let i=0;i<n;i++){const p=emit('ring',h.x,h.y,0,c,{life:900+i*250,size:(16+i*10)*d.k});if(p)p.grow=(d.king?6:2.5)*d.k}
  if(d.tier>=3){const s=toScreen(h.x,h.y);if(s.x>-200&&s.x<W+200)shake=Math.max(shake,d.king?14:6)}
  if(d.king){for(let i=0;i<3;i++){const p=emit('pillar',h.x+(i-1)*160*d.k,h.y,0,[255,240,200],{life:1400,size:40*d.k});}}
}
function updateFX(dt){
  const f=dt/16.67;shake*=.9;
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];
    p.life-=dt/p.max;if(p.life<=0){FX.splice(i,1);continue}
    if(p.follow&&p.follow.mouthW){p.x=p.follow.mouthW.x;p.y=p.follow.mouthW.y;p.a=p.follow.headAngleW??p.a}
    if(p.trail){p.trail.push([p.x,p.y]);if(p.trail.length>8)p.trail.shift();p.vx+=Math.sin(p.life*12+p.rot)*.25}
    p.x+=p.vx*f;p.y+=p.vy*f;p.vy+=p.g*f;p.vx*=.97;p.vy*=.97;p.rot+=p.vr*f;
    if(p.t==='flame'||p.t==='gas'||p.t==='smoke'||p.t==='gust')p.size*=1+.03*f;
  }
}
const NORMAL_FX=new Set(['jet','rock','gust','leaf','gas','smoke','void']);
function drawFX(add){
  worldTransform(1);ctx.globalCompositeOperation=add?'lighter':'source-over';
  for(const p of FX){if(NORMAL_FX.has(p.t)===add)continue;const L=p.life,c=p.c;

  const d={id:nextDragonId++,alive:true,body,sp,tier,king,element,pal,name:king?'Aurelion':(o.name||dragonName()),
    x:o.x,y:o.y,vx:o.vx||0,vy:o.vy||0,fx:o.vx<0?-1:1,facing:o.vx<0?-1:1,
    k:o.k??(s0+R()*(s1-s0)),maxK:o.maxK??(s0+R()*(s1-s0)),born:o.born,lifespan:king?Infinity:o.lifespan??(220000+R()*160000),gen:o.gen||1,

let performanceNow=0;

  if(tier>=3){const n=d.king?7:5;ctx.fillStyle=rgb(d.king?[255,236,170]:c.gold);
    for(let k=0;k<n;k++){const a=-Math.PI/2-.9+k*1.8/(n-1),bx=4+Math.cos(a)*6,by=-10+Math.sin(a)*3,L=(d.king?16:11)*(1-Math.abs(k-(n-1)/2)/n*.8);
      ctx.beginPath();ctx.moveTo(bx-2,by);ctx.lineTo(bx+Math.cos(a)*L*.3,by+Math.sin(a)*L);ctx.lineTo(bx+2,by);ctx.fill()}}
  ctx.fillStyle=rgb(c.spike);for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(4-k*2,2+k*3);ctx.lineTo(-12-k*3,4+k*5);ctx.lineTo(2-k*2,6+k*3);ctx.fill()}
  ctx.save();ctx.translate(10,4);ctx.rotate(jaw*.6);
  ctx.fillStyle=rgb(shade(c.body,-.15));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(30,0);ctx.quadraticCurveTo(31,3,28,5);ctx.lineTo(2,8);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(c.belly);ctx.beginPath();ctx.moveTo(2,6);ctx.lineTo(28,4);ctx.lineTo(27,5.5);ctx.lineTo(3,8);ctx.fill();
  if(jaw>.05){ctx.fillStyle='#f4ecdc';for(let x=8;x<28;x+=4){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+1.2,-3);ctx.lineTo(x+2.4,0);ctx.fill()}}
  ctx.restore();
  if(jaw>.05){ctx.fillStyle=d.king?'#fff2c8':'#3a0c0c';ctx.beginPath();ctx.moveTo(10,4);ctx.lineTo(42,2);ctx.lineTo(40,4+jaw*16);ctx.lineTo(12,6+jaw*6);ctx.fill()}
  const hg=ctx.createLinearGradient(0,-12,0,8);hg.addColorStop(0,rgb(c.light));hg.addColorStop(.55,rgb(c.body));hg.addColorStop(1,rgb(c.dark));
  ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(-2,-8);ctx.quadraticCurveTo(6,-14,14,-11);ctx.quadraticCurveTo(20,-10,24,-7);
  ctx.quadraticCurveTo(34,-6,42,-4);ctx.quadraticCurveTo(46,-2,44,1);ctx.lineTo(40,3);ctx.lineTo(12,5);ctx.quadraticCurveTo(2,9,-3,6);ctx.closePath();ctx.fill();
  ctx.strokeStyle=rgb(tier>=3?c.gold:c.dark);ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(12,-11);ctx.quadraticCurveTo(18,-11,24,-7.5);ctx.stroke();
  if(tier>=2){ctx.strokeStyle=rgba(c.glow,.8);ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(2,-7);ctx.quadraticCurveTo(14,-9,30,-5);ctx.stroke()}   // glowing brow rune
  ctx.fillStyle='#120a0a';ctx.beginPath();ctx.ellipse(40,-2.5,2,1.1,-.2,0,TAU);ctx.fill();
  ctx.fillStyle='#f4ecdc';for(let x=16;x<40;x+=5){ctx.beginPath();ctx.moveTo(x,3.6);ctx.lineTo(x+1.2,6.6+(x===26?2:0));ctx.lineTo(x+2.4,3.4);ctx.fill()}
  ctx.fillStyle='#0a0608';ctx.beginPath();ctx.ellipse(20,-6.2,3.4,2,-.15,0,TAU);ctx.fill();
  if(d.king){ctx.fillStyle='rgb(255,236,170)';ctx.beginPath();ctx.moveTo(4,-2);ctx.lineTo(8,-6);ctx.lineTo(12,-2);ctx.lineTo(8,2);ctx.closePath();ctx.fill()}  // forehead jewel
  if(c.el>0){ctx.strokeStyle=`rgba(225,225,230,${.8*c.el})`;ctx.lineWidth=1;for(let k=0;k<5;k++){const w=reduce?0:Math.sin(now/500+k)*2;ctx.beginPath();ctx.moveTo(14+k*3,8);ctx.quadraticCurveTo(10+k*2+w,16+k,4+k*2+w*1.5,22+k*2);ctx.stroke()}}
  ctx.restore();
}

const toW=(d,p)=>V(d.x+p.x*d.fx*d.k,d.y+p.y*d.k);
const headPt=(r,lx,ly)=>add(add(r.head,rot(r.headA,lx*r.hs)),rot(r.headA+Math.PI/2,ly*r.hs));
const alphaOf=d=>(d.ascend?Math.max(0,1-d.ascend*1.1):1)*(d.arrive!==undefined?Math.min(1,d.arrive):1);

function drawDragon(d,now){
  if(d.body==='serpent')return drawSerpent(d,now);
  const sp=d.sp,r=rig(d,now),c=colorsOf(d);d.rig=r;
  d.eyeW=toW(d,headPt(r,20,-6.2));d.mouthW=toW(d,headPt(r,44,3));d.headW=toW(d,headPt(r,20,0));
  d.headAngleW=d.fx<0?Math.PI-r.headA:r.headA;
  worldTransform(1);ctx.translate(d.x,d.y);ctx.scale(d.fx*d.k,d.k);ctx.globalAlpha=alphaOf(d);
  r.wings.filter(w=>w.far).sort((a,b)=>(b.second?1:0)-(a.second?1:0)).forEach(w=>drawWing(w,c,d));
  r.legs.filter(l=>l.far).forEach(l=>drawLeg(l,c,sp.thick,1,d));
  const tail=r.tail.slice().reverse(),N=tail.length;
  const mid=[.33,.66].map(t=>V(lerp(r.P.x,r.C.x,t),lerp(r.P.y,r.C.y,t)-sp.thick*.06*Math.sin(t*Math.PI)));

  const t=tubePoly(pts,widths),nIdx=pts.length,b0=Math.floor(N*.55);
  ctx.fillStyle=rgb(c.body);polyPath(t);ctx.fill();
  const inner=pts.map((p,i)=>V(lerp(p.x,t.R[i].x,.35),lerp(p.y,t.R[i].y,.35))),upper=pts.map((p,i)=>V(lerp(p.x,t.L[i].x,.3),lerp(p.y,t.L[i].y,.3)));
  ctx.fillStyle=rgba(c.light,.35);ctx.beginPath();smooth(t.L.slice(2),true);smooth(upper.slice(2).reverse(),false);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(c.belly);ctx.beginPath();smooth(t.R.slice(b0),true);smooth(inner.slice(b0).reverse(),false);ctx.closePath();ctx.fill();
  ctx.strokeStyle=rgba(shade(c.belly,-.45),.55);ctx.lineWidth=.9;for(let i=b0;i<nIdx;i++){ctx.beginPath();ctx.moveTo(t.R[i].x,t.R[i].y);ctx.lineTo(inner[i].x,inner[i].y);ctx.stroke()}
  ctx.strokeStyle=rgba(c.dark,.35);ctx.lineWidth=.7;
  for(let i=1;i<nIdx-1;i++){const p=pts[i],w=widths[i],a=Math.atan2(pts[i+1].y-pts[i-1].y,pts[i+1].x-pts[i-1].x);
    for(const o of [-.15,.25]){const q=V(lerp(p.x,t.L[i].x,o+.15),lerp(p.y,t.L[i].y,o+.15));ctx.beginPath();ctx.arc(q.x,q.y,w*.28,a+Math.PI-1.1,a+Math.PI+1.1);ctx.stroke()}}
  // gold bands for the high castes, filigree for the King
  if(d.tier>=2){ctx.strokeStyle=rgb(c.gold);ctx.lineWidth=d.tier>=3?2.2:1.5;for(let i=4;i<nIdx-3;i+=d.tier>=3?3:5){ctx.beginPath();ctx.moveTo(t.L[i].x,t.L[i].y);ctx.lineTo(t.R[i].x,t.R[i].y);ctx.stroke()}}
  if(d.king){ctx.strokeStyle='rgba(255,236,170,.9)';ctx.lineWidth=1.2;ctx.beginPath();smooth(upper.slice(3),true);ctx.stroke();ctx.beginPath();smooth(inner.slice(b0),true);ctx.stroke()}
  ctx.fillStyle=rgb(c.spike);
  for(let i=1;i<nIdx-2;i+=2){const p=t.L[i],q=pts[i],a=Math.atan2(pts[i+1].y-pts[i-1].y,pts[i+1].x-pts[i-1].x),h=widths[i]*(d.tier>=3?.95:.75)+1.5;
    const tip=V(p.x+(p.x-q.x)/widths[i]*h-Math.cos(a)*h*.5,p.y+(p.y-q.y)/widths[i]*h-Math.sin(a)*h*.5);
    ctx.beginPath();ctx.moveTo(p.x+Math.cos(a)*h*.45,p.y+Math.sin(a)*h*.45);ctx.lineTo(tip.x,tip.y);ctx.lineTo(p.x-Math.cos(a)*h*.35,p.y-Math.sin(a)*h*.35);ctx.fill()}

function drawSerpent(d,now){
  const sp=d.sp,c=colorsOf(d),k=d.k,seg=d.seg,n=seg.length;
  worldTransform(1);ctx.globalAlpha=alphaOf(d);
  const widths=seg.map((_,i)=>{const t=i/(n-1);return sp.thick*k*(t<.15?.75+t*1.6:1-Math.pow((t-.15)/.85,1.4)*.85)});
  const t=tubePoly(seg,widths);ctx.lineCap='round';

    ctx.strokeStyle=rgba(d.tier>=3?c.belly:c.wing,.75);ctx.lineWidth=1.6*k;ctx.beginPath();ctx.moveTo(up.x,up.y);ctx.quadraticCurveTo(up.x+Math.cos(a)*10*k,up.y-8*k+w*3*k,up.x+Math.cos(a)*20*k,up.y-4*k+w*6*k);ctx.stroke()}
  ctx.fillStyle=rgb(c.body);polyPath(t);ctx.fill();
  const low=seg.map((p,i)=>t.L[i].y>t.R[i].y?t.L[i]:t.R[i]),inn=seg.map((p,i)=>V(lerp(p.x,low[i].x,.3),lerp(p.y,low[i].y,.3)));
  ctx.fillStyle=rgb(c.belly);ctx.beginPath();smooth(low,true);smooth(inn.slice().reverse(),false);ctx.closePath();ctx.fill();
  ctx.strokeStyle=rgba(shade(c.belly,-.45),.5);ctx.lineWidth=.8;for(let i=2;i<n-1;i++){ctx.beginPath();ctx.moveTo(low[i].x,low[i].y);ctx.lineTo(inn[i].x,inn[i].y);ctx.stroke()}
  if(d.tier>=2){ctx.strokeStyle=rgb(c.gold);ctx.lineWidth=1.6*k;for(let i=4;i<n-3;i+=d.tier>=3?3:5){ctx.beginPath();ctx.moveTo(t.L[i].x,t.L[i].y);ctx.lineTo(t.R[i].x,t.R[i].y);ctx.stroke()}}
  for(const i of [7,19]){const l=low[i],sw=reduce?0:Math.sin(now/300+i)*3*k;ctx.strokeStyle=rgb(shade(c.body,-.15));ctx.lineWidth=3*k;
    ctx.beginPath();ctx.moveTo(l.x,l.y);ctx.lineTo(l.x+sw,l.y+10*k);ctx.stroke();ctx.strokeStyle=rgb(c.horn);ctx.lineWidth=1.1;
    for(let q=0;q<3;q++){ctx.beginPath();ctx.moveTo(l.x+sw,l.y+10*k);ctx.lineTo(l.x+sw+(q-1)*3*k,l.y+14*k);ctx.stroke()}}
  ctx.strokeStyle=rgba([0,0,0],.4);ctx.lineWidth=1;polyPath(t);ctx.stroke();
  const e=seg[n-1],e2=seg[n-2],ea=Math.atan2(e.y-e2.y,e.x-e2.x);ctx.strokeStyle=rgba(c.wing,.85);ctx.lineWidth=1.4*k;d.tailW=e;
  for(let j=-3;j<=3;j++){const w=reduce?0:Math.sin(now/300+j)*.2;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.quadraticCurveTo(e.x+Math.cos(ea+j*.12+w)*14*k,e.y+Math.sin(ea+j*.12+w)*14*k-4*k,e.x+Math.cos(ea+j*.16+w)*30*k,e.y+Math.sin(ea+j*.16+w)*30*k)}ctx.stroke();
  const h=seg[0],a=Math.atan2(h.y-seg[1].y,h.x-seg[1].x),up=Math.cos(a)<0?-1:1,hs=headScale(d)*.62;
  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(a);ctx.scale(k,k*up);
  ctx.strokeStyle=rgba(c.wing,.9);ctx.lineWidth=1.2;for(const s of [-1,1]){const w=reduce?0:Math.sin(now/400+s+d.phase)*8;ctx.beginPath();ctx.moveTo(26*hs,(2+s*2)*hs);ctx.bezierCurveTo(34*hs,(12+w)*hs,0,(26+w)*hs,-30*hs,(30+w*1.5)*hs);ctx.stroke()}
  drawHead(d,{head:V(0,0),headA:0,hs},c,now);
  ctx.restore();
  const tw=(lx,ly)=>{const ca=Math.cos(a),sa=Math.sin(a),X=lx*hs*k,Y=ly*hs*k*up;return V(h.x+X*ca-Y*sa,h.y+X*sa+Y*ca)};
  d.eyeW=tw(20,-6.2);d.mouthW=tw(44,3);d.headW=tw(20,0);d.headAngleW=a;
  ctx.globalAlpha=1;
}

// ---------- light pass: eyes, halos, the King's radiance ----------
function drawLight(d,now){
  if(!d.eyeW)return;const glow=ELEMENTS[d.element].glow,a=alphaOf(d);
  const sleeping=d.pose.sleep>.6,open=(1-Math.sin(d.blink*Math.PI))*(sleeping?0:1);
  // halo rings behind the head: thin for emperors, a whole sun for the King
  if(d.tier>=3&&d.headW){const h=d.headW,R0=(d.king?62:26)*d.k*.5;
    ctx.strokeStyle=rgba(d.king?[255,236,170]:glow,.55*a);ctx.lineWidth=d.king?3:1.6;ctx.beginPath();ctx.arc(h.x-d.fx*6*d.k,h.y-6*d.k,R0,0,TAU);ctx.stroke();
    if(d.king){const cx=h.x-d.fx*6*d.k,cy=h.y-6*d.k,rot2=reduce?0:now/4000;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R0*2.4);g.addColorStop(0,`rgba(255,244,210,${.4*a})`);g.addColorStop(1,'rgba(255,244,210,0)');ctx.fillStyle=g;ctx.fillRect(cx-R0*2.4,cy-R0*2.4,R0*4.8,R0*4.8);
      ctx.lineWidth=1.4;ctx.strokeStyle=`rgba(255,226,150,${.7*a})`;ctx.beginPath();ctx.arc(cx,cy,R0*1.35,0,TAU);ctx.stroke();
      for(let k=0;k<24;k++){const an=rot2+k*TAU/24,r1=R0*1.35,r2=R0*(k%2?1.55:1.8);ctx.beginPath();ctx.moveTo(cx+Math.cos(an)*r1,cy+Math.sin(an)*r1);ctx.lineTo(cx+Math.cos(an)*r2,cy+Math.sin(an)*r2);ctx.stroke()}
      for(let k=0;k<12;k++){const an=-rot2*1.6+k*TAU/12,rr=R0*1.12;ctx.fillStyle=`rgba(255,240,200,${.8*a})`;ctx.beginPath();ctx.arc(cx+Math.cos(an)*rr,cy+Math.sin(an)*rr,1.6,0,TAU);ctx.fill()}}}
  if(d.king){const g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,260*d.k*.5);g.addColorStop(0,`rgba(255,236,190,${.25*a})`);g.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=g;ctx.fillRect(d.x-130*d.k,d.y-130*d.k,260*d.k,260*d.k)}
  if(open<.05)return;
  const r=(7+6*SKY.night)*d.k*headScale(d)*(1+d.pose.jaw*.5)*(d.king?1.6:1),p=d.eyeW;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,rgba(glow,.75*open*a));g.addColorStop(.35,rgba(glow,.25*open*a));g.addColorStop(1,rgba(glow,0));
  ctx.fillStyle=g;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);
  ctx.fillStyle=`rgba(255,250,230,${open*a})`;ctx.beginPath();ctx.arc(p.x,p.y,1.4*d.k*headScale(d),0,TAU);ctx.fill();
}


// ===================== Behaviour, castes and life cycle =====================
// Rules of the castes: a dragon may live in its own zone or any lower one, never in a higher one.
// The King lives on the Throne of Heaven, patrols the whole valley now and then, and everyone bows as he passes.
const CAP=()=>W<700?14:26;
const EVENTS=[];const logEvent=text=>{EVENTS.unshift({text,t:performanceNow});if(EVENTS.length>5)EVENTS.pop()};
const isAir=s=>s==='fly'||s==='approach'||s==='takeoff'||s==='ascend'||s==='patrol';
const ageOf=d=>d.king?.4:(performanceNow-d.born)/d.lifespan;
const adultish=d=>d.k>=.85*d.maxK;
let KING=null;

function standHeight(d){const sp=d.sp,P=d.pose;if(!sp.legs)return 40*d.k;
  const legH=(sp.leg[0]+sp.leg[1])*.82+sp.thick*.3;return lerp(lerp(legH,legH*.88,P.sit),sp.thick*.48,P.sleep)*d.k}
function perchScore(d,p){
  if(p.holder&&p.holder!==d)return-1;
  if(p.king)return d.king?100:-1;
  if(p.tier>d.tier)return-1;                         // never above your caste
  let s=1+R()*.6-(d.tier-p.tier)*1.2;if(p.tier===d.tier)s+=2.5;
  if(d.element==='fire'||d.element==='magma')s+=p.volcano?2:0;
  if(d.body==='wyvern')s+=p.type==='ruin'||p.type==='island'?1:0;
  if(d.body==='serpent')s+=p.type==='hill'||p.type==='peak'||p.type==='island'?1.2:-.5;
  if(d.home&&p===d.home.perch)s+=SKY.night>.5||d.home.eggs.length?5:1.2;
  s-=Math.abs(p.x-d.x)/3000;return s;
}
function choosePerch(d){let best=null,bs=0;for(const p of PERCHES){const s=perchScore(d,p);if(s>bs){bs=s;best=p}}return best}
function chooseHome(d){
  if(d.king)return null;
  const free=NESTS.filter(n=>!n.owner&&n.tier<=d.tier);if(!free.length)return null;
  free.sort((a,b)=>perchScore(d,b.perch)-perchScore(d,a.perch));const n=free[0];n.owner=d;d.home=n;return n;
}
function releasePerch(d){if(d.perch&&d.perch.holder===d)d.perch.holder=null;d.perch=null}
function setSpot(d,p,dx=0){d.perch=p;if(!d.parent||adultish(d))p.holder=d;d.spot=V(p.x+dx,p.y)}
function zoneRange(d){const z=ZONES[d.tier],lo=d.tier>0?ZONES[d.tier-1].x0+300:0;return[lo,z.x1-60]}
function wander(d){
  const [lo,hi]=zoneRange(d),x=clamp(lo+R()*(hi-lo),150,WORLD_W-150);
  d.target=V(x,clamp(surf(x)-220-R()*320*d.k,80,650));
}
function go(d,state,timer=0){d.state=state;d.timer=timer}
function startRoar(d,ms=1300){if(d.roarT<=0)roarBurst(d);d.roarT=ms}
function startBreath(d,ms){d.breathT=ms??(d.king?2600:1400)}

// ---------- spawning ----------
function spawnStray(now){
  if(R()<.75){const d=makeDragon({tier:0,x:-150,y:200+R()*200,vx:3,born:now-R()*20000});d.arrive=0;go(d,'fly');d.target=V(300+R()*900,320);chooseHome(d);
    logEvent(`${d.name}, a common ${ELEMENTS[d.element].name.toLowerCase()} ${d.sp.label.toLowerCase()}, wandered in from the wilds`)}
  else{const tier=2+Math.floor(R()*2),z=ZONES[tier],x=z.x0+300+R()*(z.x1-z.x0-600),d=makeDragon({tier,x,y:-220,vx:R()<.5?1:-1,born:now-R()*30000});
    d.arrive=0;go(d,'fly');d.target=V(x,350);chooseHome(d);for(let i=0;i<20;i++)emit('star',x,60,Math.PI/2,ELEMENTS[d.element].glow,{v:3,spread:1.2,life:1400,size:3});
    logEvent(`${titleOf(d)} of ${ELEMENTS[d.element].name} descended from the heavens`)}
}
function layEgg(d,now){
  const n=d.home,el=ELEMENTS[d.element];
  n.eggs.push({tier:d.tier,element:d.element,body:d.body,laid:now,hatchAt:now+24000+R()*16000,parent:d,color:shade(el.body,.15),glow:el.glow});
  d.nextEgg=now+70000+R()*60000;logEvent(`${titleOf(d)} laid a ${el.name.toLowerCase()} egg at ${n.name}`);
}
function hatch(n,e,now){
  const p=e.parent&&e.parent.alive?e.parent:null,[s0,s1]=TIERS[e.tier].scale,maxK=s0+R()*(s1-s0);
  const d=makeDragon({tier:e.tier,body:e.body,element:R()<.7?e.element:undefined,x:n.x,y:n.y-14,k:maxK*.3,maxK,born:now,parent:p,gen:p?p.gen+1:1});
  if(p)p.children++;
  d.perch=n.perch;d.spot=V(n.x+(R()<.5?-26:26),n.y);go(d,'perch',3000+R()*3000);d.pose.legs=d.want.legs=1;d.pose.fold=d.want.fold=1;
  for(let i=0;i<14;i++)emit('orb',n.x,n.y-12,-Math.PI/2,e.glow,{v:2,spread:1.4,life:900,size:2});
  logEvent(`${d.name} hatched at ${n.name}`);
}

// ---------- the opening scene ----------
function seedWorld(now){
  const plan=[[0,6],[1,5],[2,4],[3,3]];
  for(const [tier,count] of plan){
    const ps=PERCHES.filter(p=>p.tier===tier&&!p.king);
    for(let i=0;i<count;i++){
      const p=ps[i%ps.length],free=p&&!p.holder,d=makeDragon({tier,x:p?p.x:ZONES[tier].x0+400,y:p?p.y-80:300,vx:R()<.5?2:-2,born:now-R()*120000});
      d.k=d.maxK;
      if(p&&p.nest&&!p.nest.owner){p.nest.owner=d;d.home=p.nest}
      if(free&&i%3!==2){setSpot(d,p);d.y=p.y-standHeight(d);d.x=p.x;go(d,'perch',4000+R()*9000);d.pose.legs=d.want.legs=1;d.pose.fold=d.want.fold=1}
      else{d.x=ZONES[tier].x0+200+R()*(ZONES[tier].x1-ZONES[tier].x0-400);d.y=250+R()*200;go(d,'fly');wander(d);if(!d.home)chooseHome(d)}
    }
  }
  const throne=PERCHES.find(p=>p.king);
  KING=makeDragon({king:1,tier:4,x:throne.x,y:throne.y-120,vx:-1,born:now-60000});
  setSpot(KING,throne);KING.y=throne.y-standHeight(KING);go(KING,'perch',14000);KING.pose.legs=KING.want.legs=1;KING.pose.fold=KING.want.fold=1;KING.facing=-1;KING.fx=-1;
  // an egg about to hatch among the commoners, and a young one beside its mother
  const nest=NESTS.find(n=>n.owner&&n.tier===0);
  if(nest)nest.eggs.push({tier:0,element:nest.owner.element,body:nest.owner.body,laid:now-20000,hatchAt:now+9000,parent:nest.owner,color:shade(ELEMENTS[nest.owner.element].body,.15),glow:ELEMENTS[nest.owner.element].glow});
  const mom=DRAGONS.find(d=>d.tier===1&&d.home&&d.state==='perch');
  if(mom){const h=makeDragon({tier:1,body:mom.body,element:mom.element,x:mom.x-40,y:mom.y,k:mom.maxK*.42,maxK:mom.maxK,born:now-15000,parent:mom,gen:2});mom.children++;
    h.perch=mom.perch;h.spot=V(mom.home.x-30,mom.home.y);go(h,'perch',5000);h.pose.legs=h.want.legs=1;h.pose.fold=h.want.fold=1;h.y=mom.home.y-standHeight(h)}
}

// ---------- per frame ----------
let nextStray=0;
function updateWorld(now,dt){
  performanceNow=now;
  const f=dt/16.67,night=SKY.night>.62,morning=SKY.night<.25;
  for(const n of NESTS)for(let i=n.eggs.length-1;i>=0;i--)if(now>=n.eggs[i].hatchAt){const e=n.eggs.splice(i,1)[0];if(DRAGONS.length<CAP())hatch(n,e,now)}
  const adults=DRAGONS.filter(adultish).length;
  if(now>nextStray){if(DRAGONS.length<CAP()&&adults<CAP()*.6)spawnStray(now);nextStray=now+16000+R()*18000}
  for(const d of [...DRAGONS])updateDragon(d,now,dt,f,night,morning);
  for(let i=DRAGONS.length-1;i>=0;i--)if(!DRAGONS[i].alive)DRAGONS.splice(i,1);
}

function updateDragon(d,now,dt,f,night,morning){
  const sp=d.sp,P=d.pose,Wt=d.want;
  if(d.arrive!==undefined){d.arrive+=dt/1500;if(d.arrive>=1)delete d.arrive}
  if(d.k<d.maxK)d.k=Math.min(d.maxK,d.k+d.maxK*.7*dt/80000);
  if(d.parent&&(!d.parent.alive||d.parent.state==='ascend'||adultish(d))){if(adultish(d)&&d.parent)logEvent(`${d.name} left ${d.parent.name}'s nest`);d.parent=null;if(!d.home)chooseHome(d)}
  if(!d.parent&&adultish(d)&&!d.home&&R()<.002)chooseHome(d);
  const kid=d.parent&&!adultish(d);              // decided after the parent check, so an orphan never reads a missing parent
  if(!d.king&&d.state!=='ascend'&&ageOf(d)>=1){releasePerch(d);if(d.home){d.home.owner=null;d.home=null}go(d,'ascend');d.y0=d.y;logEvent(`${titleOf(d)} ascended to the stars`)}
  if(d.blink<=0&&R()<.003)d.blink=1;if(d.blink>0)d.blink=Math.max(0,d.blink-dt/150);
  if(d.roarT>0)d.roarT-=dt;
  if(d.breathT>0){d.breathT-=dt;breathe(d)}
  if(d.tier>=2&&!reduce&&R()<(d.king?.6:d.tier===3?.12:.05))auraMote(d);
  if(d.king&&!reduce&&R()<.5&&d.tailW)emit('star',d.tailW.x,d.tailW.y,Math.PI/2,[255,240,200],{v:.5,spread:1,life:1400,size:2.2});
  d.timer-=dt;

  switch(d.state){
    case 'fly':{
      if(kid){const p=d.parent;
        if(!isAir(p.state)&&p.perch){d.perch=p.perch;d.spot=V(p.perch.x+(d.id%2?-34:34)*(.6+p.k*.4),p.perch.y);go(d,'approach');break}
        d.target=V(p.x-p.fx*(70+d.id%3*20)*p.k,p.y+30*p.k);break}
      if(!d.target||Math.hypot(d.target.x-d.x,d.target.y-d.y)<70){
        if(night||d.timer<0&&R()<.6||d.home&&d.home.eggs.length&&R()<.5){const p=choosePerch(d);if(p){setSpot(d,p);go(d,'approach');break}}
        wander(d);if(d.timer<0)d.timer=12000+R()*20000}
      if(d.tier>=1&&R()<.0012*d.tier&&d.breathT<=0){startRoar(d,900);startBreath(d,900)}
      break}
    case 'patrol':{                                   // the King's flight over his realm
      if(!d.route||!d.route.length){const p=PERCHES.find(q=>q.king);setSpot(d,p);go(d,'approach');break}
      d.target=d.route[0];if(Math.hypot(d.target.x-d.x,d.target.y-d.y)<120){d.route.shift();if(R()<.5){startRoar(d,1600);startBreath(d,2200)}}
      break}
    case 'approach':{
      if(kid&&isAir(d.parent.state)){go(d,'fly');break}
      if(!kid&&d.perch&&d.perch.holder&&d.perch.holder!==d){go(d,'fly');wander(d);break}
      d.target=V(d.spot.x,d.spot.y-standHeight(d)-70*d.k);
      if(Math.hypot(d.target.x-d.x,d.target.y-d.y)<40*d.k+10)go(d,sp.wings?'land':'perch',sp.wings?0:8000+R()*12000);
      break}
    case 'land':{
      d.target=V(d.spot.x,d.spot.y-standHeight(d));
      if(Math.hypot(d.target.x-d.x,d.target.y-d.y)<3){d.x=d.target.x;d.y=d.target.y;d.vx=d.vy=0;go(d,'perch',kid?2000:d.king?20000+R()*20000:7000+R()*14000);if(d.king)startRoar(d,1400)}
      break}
    case 'perch':case 'brood':case 'sleep':{
      if(kid){const p=d.parent;if(isAir(p.state)&&d.state!=='sleep'||p.state==='takeoff'){go(d,'takeoff',700);break}Wt.sleep=p.state==='sleep'||night?1:0;break}
      if(d.state==='sleep'){if(morning&&d.timer<0)go(d,'perch',3000+R()*5000);break}
      if(!d.king&&d.home&&d.perch===d.home.perch&&now>d.nextEgg&&d.home.eggs.length<2&&ageOf(d)>.15&&ageOf(d)<.8&&DRAGONS.length+NESTS.reduce((a,n)=>a+n.eggs.length,0)<CAP()){layEgg(d,now);go(d,'brood',12000)}
      if(d.state==='perch'&&R()<(d.king?.002:.0008))startRoar(d,d.king?1800:1100);
      if(d.timer<0){
        if(night&&!d.king)go(d,'sleep',4000+R()*8000);
        else if(d.king){if(night)go(d,'brood',16000);else{const xs=[5600,4200,2800,1500,700,2200,3800,5500,6700];d.route=xs.map(x=>V(x,clamp(surf(x)-380,90,420)));go(d,'takeoff',1200);d.afterTakeoff='patrol';logEvent('The Dragon King takes to the sky')}}
        else if(d.state==='perch'&&d.home&&d.perch===d.home.perch&&d.home.eggs.length&&R()<.6)go(d,'brood',10000+R()*10000);
        else go(d,'takeoff',900);
      }
      break}
    case 'takeoff':{if(d.timer<0){releasePerch(d);if(d.afterTakeoff){go(d,d.afterTakeoff);d.afterTakeoff=null}else{go(d,'fly',kid?0:12000+R()*18000);if(!kid)wander(d)}}break}
    case 'ascend':{d.ascend=clamp((d.y0-d.y)/(d.y0+320),0,1);d.target=V(d.x+Math.sin(now/800)*40,-600);
      if(d.y<-320){d.alive=false;memorialStars.push({x:(d.x/WORLD_W*.9+.05),y:.05+R()*.28,r:1.4+d.k,p:R()*7,c:d.pal.eye,born:now});if(cam.follow===d)cam.follow=null}
      break}
  }

  // ---- pose targets ----
  const air=isAir(d.state)||d.state==='land';
  if(air){Wt.fold=d.state==='land'?.15:0;Wt.legs=d.state==='land'||d.state==='takeoff'?.9:0;Wt.sit=0;Wt.sleep=0;Wt.neck=-.32}
  else{Wt.fold=1;Wt.legs=1;Wt.sit=d.state==='brood'?1:0;if(!kid)Wt.sleep=d.state==='sleep'?1:0;Wt.neck=Wt.sleep>.5?.55:Wt.sit>.5?-.75:-1.0}
  const rate=.07*f;for(const key of ['fold','legs','sit','sleep','neck'])P[key]+=(Wt[key]-P[key])*Math.min(1,rate);
  P.jaw+=((d.roarT>0||d.breathT>0?1:0)-P.jaw)*Math.min(1,.2*f);

  // ---- move ----
  if(air||!sp.wings){
    const ground=!sp.wings&&!air;let tx,ty;
    if(ground&&d.spot){const t=now/(d.state==='sleep'?2600:1300)+d.phase;tx=d.spot.x+Math.cos(t)*34*d.k;ty=d.spot.y-46*d.k+Math.sin(t)*16*d.k}
    else if(d.state==='takeoff'){tx=d.x+d.facing*40;ty=d.y-120}
    else if(d.target){tx=d.target.x;ty=d.target.y}else{tx=d.x;ty=d.y}
    const dx=tx-d.x,dy=ty-d.y,dist=Math.hypot(dx,dy)||1;
    const maxV=sp.speed*(.55+.45*Math.min(1.2,d.k))*(kid?1.15:1)*(d.state==='land'?.35:1)*(ground?.5:1)*(d.state==='ascend'?.9:1)*(d.king?.75:1);
    const want=Math.min(1,dist/(d.state==='land'?40:150))*maxV;
    d.vx+=(dx/dist*want-d.vx)*.045*f;d.vy+=(dy/dist*want-d.vy)*.045*f;
    if((d.state==='fly'||d.state==='patrol')&&d.y>surf(d.x)-110*d.k)d.vy-=.35*f;
    if(d.state==='fly')d.x=clamp(d.x,-200,WORLD_W+200);
    d.x+=d.vx*f;d.y+=d.vy*f;
    if(Math.abs(d.vx)>.35)d.facing=Math.sign(d.vx);
    P.pitch=clamp(Math.atan2(d.vy,Math.abs(d.vx)+.5)*.6,-.5,.45);
    d.flapSpeed=(1+Math.max(0,-d.vy)*.35+(d.state==='land'||d.state==='takeoff'?.9:0)+(kid?.4:0))*(d.king?.6:1);
    P.flap+=dt*.0075*d.flapSpeed*(d.vy>1.2&&isAir(d.state)?.35:1);
  }else{
    const sy=d.spot?d.spot.y-standHeight(d):d.y;d.x+=((d.spot?d.spot.x:d.x)-d.x)*.1*f;d.y+=(sy-d.y)*.1*f;d.vx=d.vy=0;P.pitch*=.9;P.flap+=dt*.002;
  }
  d.groundLocal=d.spot?(d.spot.y-d.y)/d.k:60;

  // ---- head: look ahead, look around, bow to the King, or look at the cursor ----
  let look=air?P.pitch*.6-.05:-.12+.22*Math.sin(now/1700+d.phase);
  if(P.sleep>.5)look=.95;
  const hx=d.headW?d.headW.x:d.x,hy=d.headW?d.headW.y:d.y;
  if(KING&&d!==KING&&KING.alive&&P.sleep<.5&&Math.hypot(KING.x-d.x,KING.y-d.y)<520*KING.k*.5){look=.75;if(!air)d.facing=Math.sign(KING.x-d.x)||d.facing}   // bow
  else{const cd=Math.hypot(mouse.wx-hx,mouse.wy-hy);
    if(mouse.inside&&cd<320*Math.max(1,d.k*.7)&&P.sleep<.5&&d.state!=='ascend'){
      const fx=Math.sign(d.fx)||1;let lx=(mouse.wx-hx)*fx;
      if(!air&&lx<-20&&d.body!=='serpent'){d.facing=-d.facing;lx=-lx}
      look=clamp(Math.atan2(mouse.wy-hy,Math.max(lx,10)),-1.2,.95)}}
  P.head+=(look-P.head)*Math.min(1,.08*f);
  d.fx+=(d.facing-d.fx)*Math.min(1,.12*f);if(Math.abs(d.fx)<.05)d.fx=.05*Math.sign(d.facing||1);
  if(d.seg){d.seg[0].x=d.x;d.seg[0].y=d.y;const L=sp.segL*d.k;
    for(let i=1;i<d.seg.length;i++){const a=d.seg[i-1],s=d.seg[i],ang=Math.atan2(s.y-a.y,s.x-a.x)+(reduce?0:Math.sin(now/300-i*.4+d.phase)*.04);s.x=a.x+Math.cos(ang)*L;s.y=a.y+Math.sin(ang)*L}}
}


// ===================== Interface: caste track, info cards, minimap, census, events =====================
let selected=null;
const $=id=>document.getElementById(id);
const card=$('card'),census=$('census'),clockEl=$('clock'),ticker=$('ticker'),mini=$('mini'),mctx=mini.getContext('2d'),track=$('track'),banner=$('banner');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dragonAt(wx,wy){
  let best=null,bd=1e9;
  for(const d of DRAGONS){if(d.state==='ascend')continue;
    const pts=[V(d.x,d.y),d.headW||V(d.x,d.y)];if(d.rig)pts.push(toW(d,d.rig.P));if(d.seg)pts.push(d.seg[8],d.seg[16]);
    for(const p of pts){const dist=Math.hypot(p.x-wx,p.y-wy),r=(d.seg?22:34)*d.k+8;if(dist<r&&dist<bd){bd=dist;best=d}}}
  return best;
}
const nestAt=(wx,wy)=>NESTS.find(n=>Math.abs(n.x-wx)<40&&Math.abs(n.y-12-wy)<26);
onClickHandlers.push((wx,wy)=>{
  const d=dragonAt(wx,wy);if(d){selected={type:'dragon',ref:d};startRoar(d);renderCard(true);return}
  const n=nestAt(wx,wy);if(n){selected={type:'nest',ref:n};renderCard(true);return}
  selected=null;renderCard(true);
});
function statusOf(d){
  const p=d.perch?d.perch.name:'the cliffs';
  switch(d.state){
    case 'fly':return d.parent&&!adultish(d)?`Flying beside ${d.parent.name}`:`Soaring over ${zoneAt(d.x).name}`;
    case 'patrol':return 'Patrolling the realm — all bow as he passes';
    case 'approach':return `Heading for ${p}`;case 'land':return `Landing on ${p}`;
    case 'perch':return d.king?'Enthroned on the Throne of Heaven':d.body==='serpent'?`Coiled around ${p}`:`Perched on ${p}`;
    case 'brood':return d.king?'Keeping watch from the Throne of Heaven':`Guarding eggs at ${p}`;case 'sleep':return `Asleep on ${p}`;
    case 'takeoff':return 'Taking flight';case 'ascend':return 'Ascending to the stars';default:return '';
  }
}
const pct=v=>`${Math.round(clamp(v,0,1)*100)}%`;
const TIER_COL=['#9a9488','#c98a4a','#c7c9d6','#e8c46a','#fff1c4'];
function renderCard(force){
  if(!selected||(selected.type==='dragon'&&!selected.ref.alive)){if(!card.hidden||force){card.hidden=true;card.innerHTML=''}selected=null;return}
  card.hidden=false;
  if(selected.type==='dragon'){const d=selected.ref,el=ELEMENTS[d.element],age=clamp(ageOf(d),0,1),following=cam.follow===d;
    card.classList.toggle('royal',d.king);
    card.innerHTML=`
      <div class="card-head"><span class="swatch" style="background:rgb(${el.body});box-shadow:0 0 0 2px rgb(${el.glow}),0 0 14px rgb(${el.glow})"></span>
        <div><h2>${esc(d.king?'Aurelion':d.name)}</h2><p class="sub">${d.king?'The Dragon King · Sovereign of Aether':`${esc(TIERS[d.tier].name)} caste · ${esc(d.sp.label)} · ${stageOf(d)}`}</p></div>
        <button class="x" data-act="close" aria-label="Close">×</button></div>
      <p class="badges"><span class="tier" style="color:${TIER_COL[d.tier]};border-color:${TIER_COL[d.tier]}">${esc(d.king?'King':TIERS[d.tier].name)}</span><span class="elem" style="color:rgb(${el.glow});border-color:rgba(${el.glow},.6)">${esc(el.name)}</span></p>
      <p class="desc">${esc(el.desc)}</p>

      ${d.king?'':`<div class="meter" aria-label="Life"><i style="width:${pct(age)}"></i></div>`}
      <dl>
        <dt>Size</dt><dd>${d.king?'Colossal':pct(d.k/d.maxK)+' grown'}</dd>
        <dt>Realm</dt><dd>${esc(ZONES[d.tier].name)}</dd>
        <dt>Home</dt><dd>${d.king?'Throne of Heaven':d.home?esc(d.home.name):'None yet'}</dd>
        ${d.king?'':`<dt>Parent</dt><dd>${d.parent?esc(d.parent.name):'—'}</dd><dt>Hatchlings</dt><dd>${d.children}</dd><dt>Generation</dt><dd>${d.gen}</dd>`}
      </dl>
      <div class="actions"><button data-act="follow">${following?'Stop following':'Follow'}</button><button data-act="roar">Roar</button><button data-act="breath">Breathe ${esc(el.name)}</button></div>`;
  }else{const n=selected.ref,now=performanceNow;card.classList.remove('royal');
    card.innerHTML=`
      <div class="card-head"><span class="swatch nest"></span><div><h2>${esc(n.name)}</h2><p class="sub">${esc(TIERS[n.tier].name)} nest · ${n.eggs.length} egg${n.eggs.length===1?'':'s'}</p></div>
        <button class="x" data-act="close" aria-label="Close">×</button></div>
      <p class="status">${n.owner?`Claimed by ${esc(titleOf(n.owner))}`:'Unclaimed — waiting for a dragon of this caste or higher'}</p>
      ${n.eggs.map((e,i)=>`<div class="egg"><span style="color:rgb(${e.glow})">${esc(ELEMENTS[e.element].name)}</span><div class="meter"><i style="width:${pct((now-e.laid)/(e.hatchAt-e.laid))}"></i></div><span>${Math.max(0,Math.ceil((e.hatchAt-now)/1000))}s</span></div>`).join('')||'<p class="muted">No eggs right now.</p>'}
      <div class="actions"><button data-act="close">Close</button></div>`;
  }
}
card.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!selected)return;const act=b.dataset.act,d=selected.ref;
  if(act==='close'){selected=null;renderCard(true)}

// ---------- caste track: the five realms, and where you are looking ----------

const TIER_LABELS=['Common','Middle','High','Emperor'];

// ---------- minimap ----------
function drawMinimap(){
  const w=mini.clientWidth,h=mini.clientHeight;if(!w)return;
  if(mini.width!==Math.round(w*DPR)){mini.width=Math.round(w*DPR);mini.height=Math.round(h*DPR)}
  mctx.setTransform(DPR,0,0,DPR,0,0);mctx.clearRect(0,0,w,h);
  const sx=w/WORLD_W,sy=h/WORLD_H,g=mctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(10,10,14,.6)');g.addColorStop(1,'rgba(80,70,40,.55)');
  mctx.fillStyle=g;mctx.fillRect(0,0,w,h);
  mctx.beginPath();mctx.moveTo(0,h);for(let i=0;i<NS;i+=6)mctx.lineTo(i*STEP*sx,SURF[i]*sy);mctx.lineTo(w,h);mctx.closePath();
  const tg=mctx.createLinearGradient(0,0,w,0);tg.addColorStop(0,'rgba(110,100,96,.7)');tg.addColorStop(1,'rgba(240,226,190,.8)');mctx.fillStyle=tg;mctx.fill();
  mctx.fillStyle='rgba(255,110,40,.9)';mctx.beginPath();mctx.arc(VOLCANO.cx*sx,VOLCANO.peak*sy,2.2,0,TAU);mctx.fill();
  for(const n of NESTS){mctx.fillStyle=n.eggs.length?'#ffd27a':'rgba(200,170,120,.7)';mctx.fillRect(n.x*sx-1.5,n.y*sy-3,3,3)}
  for(const d of DRAGONS){mctx.fillStyle=d.king?'#fff3c8':`rgb(${d.pal.eye})`;mctx.beginPath();mctx.arc(d.x*sx,d.y*sy,d.king?3.6:adultish(d)?2.2:1.4,0,TAU);mctx.fill()}
  mctx.strokeStyle='rgba(236,214,160,.95)';mctx.lineWidth=1;mctx.strokeRect(cam.x*sx+.5,cam.y*sy+.5,viewW()*sx-1,viewH()*sy-1);
}
let miniDrag=false;
const miniJump=e=>{const r=mini.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*WORLD_W,y=(e.clientY-r.top)/r.height*WORLD_H;cam.follow=null;cam.x=x-viewW()/2;cam.y=y-viewH()/2;clampCam()};
mini.addEventListener('pointerdown',e=>{e.stopPropagation();miniDrag=true;mini.setPointerCapture(e.pointerId);miniJump(e)});
mini.addEventListener('pointermove',e=>{if(miniDrag)miniJump(e)});
mini.addEventListener('pointerup',()=>miniDrag=false);

// ---------- main loop ----------
let prev=performance.now(),hudT=0;
skyAt(prev);seedWorld(prev);
function frame(now){
  const dt=Math.min(50,now-prev);prev=now;
  skyAt(now);updateCamera(dt);updateWorld(now,dt);updateFX(dt);updateTrack(dt);
  const shx=shake?(R()-.5)*shake/camScale():0,shy=shake?(R()-.5)*shake/camScale():0;cam.x+=shx;cam.y+=shy;
  drawSky(now);drawHeavenFx(now);drawBackLayers();drawTerrain(now);
  for(const n of NESTS)drawNest(n,now);
  drawVolcanoFx(now);
  const x0=cam.x-500,x1=cam.x+viewW()+500;
  const hov=mouse.inside&&!dragStart?dragonAt(mouse.wx,mouse.wy):null;cv.style.cursor=hov?'pointer':dragStart&&moved>5?'grabbing':'';
  const vis=DRAGONS.filter(d=>d.x>x0&&d.x<x1).sort((a,b)=>a.k-b.k);
  for(const d of vis)drawDragon(d,now);
  drawFX(false);
  ctx.globalCompositeOperation='lighter';drawEggGlow(now);
  for(const d of vis)drawLight(d,now);
  const sel=selected&&selected.type==='dragon'?selected.ref:null;
  for(const d of [sel,hov])if(d&&d.alive){const r=90*d.k,g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,r);
    g.addColorStop(0,`rgba(${d.pal.eye},${d===sel?.16:.1})`);g.addColorStop(1,`rgba(${d.pal.eye},0)`);ctx.fillStyle=g;ctx.fillRect(d.x-r,d.y-r,r*2,r*2)}
  if(selected&&selected.type==='nest'){const n=selected.ref,g=ctx.createRadialGradient(n.x,n.y-10,0,n.x,n.y-10,70);g.addColorStop(0,'rgba(255,210,120,.2)');g.addColorStop(1,'rgba(255,210,120,0)');ctx.fillStyle=g;ctx.fillRect(n.x-70,n.y-80,140,140)}
  ctx.globalCompositeOperation='source-over';
  drawFX(true);
  drawForeground();
  cam.x-=shx;cam.y-=shy;
  screenTransform();
  if(hov&&hov.headW){const p=toScreen(hov.headW.x,hov.headW.y-40*hov.k);ctx.font='600 12px "Cinzel", Georgia, serif';ctx.textAlign='center';
    const label=hov.king?'Aurelion · The Dragon King':`${titleOf(hov)} · ${TIERS[hov.tier].name} ${ELEMENTS[hov.element].name} ${hov.sp.label}`,tw=ctx.measureText(label).width;
    ctx.fillStyle='rgba(10,8,10,.72)';ctx.fillRect(p.x-tw/2-8,p.y-16,tw+16,22);ctx.fillStyle=TIER_COL[hov.tier];ctx.fillText(label,p.x,p.y)}
  drawMinimap();
  hudT-=dt;if(hudT<=0){renderHud();hudT=250}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
