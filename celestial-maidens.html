<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Celestial Maidens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed night sky, one quiet caption bottom-left */
:root{
  --bg:#0d0c10; --bone:#e8dcc4; --muted:#7a7085;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);overflow:hidden;cursor:crosshair;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:fixed;left:0;bottom:0;pointer-events:none;
  padding:0 max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:4px}
.cap h1{margin:0;font:700 clamp(18px,3vw,26px)/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--bone)}
.cap h1,.cap p{text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.5)}
.cap p{margin:0;font:400 11px/1.4 var(--mono);letter-spacing:.08em;color:#c9cbd8;text-transform:uppercase}
</style>
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>

<canvas id="c" aria-label="A swarm of celestial maidens with flowing gowns and glowing eyes that follow your cursor"></canvas>
<div class="cap">
  <h1>Celestial Maidens</h1>
  <p>Move your cursor · tap to make them cast starlight</p>
  <p id="count">3 maidens</p>
  <p id="form" hidden></p>
  <p id="clock"></p>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const cursor={x:W/2,y:H/2}; let lastMove=-1e9, strike=0;
function setT(x,y){cursor.x=x;cursor.y=y;lastMove=performance.now()}
addEventListener('pointermove',e=>setT(e.clientX,e.clientY));
addEventListener('pointerdown',e=>{setT(e.clientX,e.clientY);strike=1;
  for(const d of drags){if(d.asc)continue;d.lunge=.7+Math.random()*.5;
    const h=d.seg[0],a=Math.atan2(cursor.y-h.y,cursor.x-h.x);
    for(let i=0;i<8;i++){const sp=a+(Math.random()-.5)*.6,v=2.5+Math.random()*4;sparks.push({x:h.x+Math.cos(a)*22*d.k,y:h.y+Math.sin(a)*22*d.k,vx:Math.cos(sp)*v,vy:Math.sin(sp)*v,life:1,c:d.sk.g})}}});

// eye colours: [core, glow rgb]
const EYES=[
  ['#fff1c2','255,122,60'],   // ember
  ['#e6fbff','40,220,255'],   // spectral cyan
  ['#f6e6ff','190,90,255'],   // void violet
  ['#f0ffd8','120,255,90'],   // toxic green
  ['#ffe0e0','255,40,70'],    // blood red
  ['#fff9d6','255,210,40'],   // gold
  ['#e4ecff','110,140,255'],  // ice blue
  ['#ffe4f6','255,80,190'],   // hex pink
];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const BG=[7,8,15], ROBE=[242,242,250];
const SKIN_TONES=[[255,226,204],[243,198,165],[226,174,132],[198,140,100],[158,106,72],[118,80,56]];
const HAIR=[[28,22,30],[88,52,34],[150,68,38],[232,200,120],[222,226,242],[42,52,128],[120,52,120]];

// Celestial skins: a = skin at head, b = skin at tail, m = mane / whiskers / horns, g = aura glow, p = pattern
const SKINS=[
  {a:[60,120,215], b:[175,215,255],m:[255,240,200],g:'120,180,255',p:'scales'}, // azure sky
  {a:[28,32,90],   b:[70,55,150],  m:[200,215,255],g:'140,150,255',p:'stars'},  // starlit night
  {a:[225,160,35], b:[255,228,140],m:[255,120,50], g:'255,190,80', p:'scales'}, // solar gold
  {a:[205,212,232],b:[250,250,255],m:[165,200,255],g:'200,220,255',p:'pearl'},  // moon pearl
  {a:[140,55,175], b:[250,120,185],m:[120,225,255],g:'230,110,220',p:'stars'},  // nebula
  {a:[35,150,115], b:[165,235,195],m:[250,228,150],g:'120,240,190',p:'scales'}, // jade heaven
  {a:[195,40,50],  b:[255,150,80], m:[255,220,90], g:'255,120,70', p:'scales'}, // vermilion phoenix
  {a:[35,195,175], b:[135,90,235], m:[205,255,240],g:'120,240,220',p:'stars'},  // aurora
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

// Arrivals: new maidens fly in from the edges or descend through a portal of light. No growth: everyone arrives as an adult.
const cap=()=>W<600?12:W<1100?18:24;                // population limit so the page stays smooth

function paint(d){                                  // smaller (farther) maidens sink into the dark
  const fade=Math.max(0,Math.min(1,(1.2-d.k)/.95))*.5;d.paintedK=d.k;
  d.skinTone=rgb(mix(d.tone,BG,fade));d.skinShade=rgb(mix(mix(d.tone,[60,30,30],.25),BG,fade));
  d.hairCol=rgb(mix(d.hair,BG,fade));d.hairHi=rgb(mix(mix(d.hair,[255,255,255],.3),BG,fade));
  d.robe=rgb(mix(ROBE,BG,fade));d.robeShade=rgb(mix(mix(ROBE,[150,160,190],.4),BG,fade));
  const S=d.sk;
  d.skinCols=Array.from({length:d.N},(_,i)=>rgb(mix(mix(S.a,S.b,i/(d.N-1)),BG,fade)));
  d.belly=rgb(mix(mix(S.b,[255,255,255],.4),BG,fade));
  d.mane=rgb(mix(S.m,BG,fade));
}
// the gown's colors bloom from the shoulders down to the hem
const sv=(d,i)=>Math.max(0,Math.min(1,d.skin*1.6-(i/d.N)*.6));
let nextId=0;
function makeMaiden({x,y,k,maxK,eye,now,angle,sk,portal}){
  const N=Math.round(17+Math.random()*5);
  const d={id:nextId++,slot:0,k,maxK,N,gap:13*k,eye,sk:sk||pick(SKINS),skin:0,
    skinStart:now+1500+Math.random()*4000,skinDur:12000+Math.random()*14000,
    speed:.08+Math.random()*.07,
    orbitR:40+Math.random()*220,orbitW:(.3+Math.random()*.6)*(Math.random()<.5?-1:1),phase:Math.random()*7,
    lunge:0,blink:0,born:now,asc:0,lifespan:45000+Math.random()*45000,portal:!!portal,tone:pick(SKIN_TONES),hair:pick(HAIR),seg:[],feet:[]};
  const a=angle??Math.random()*7;
  for(let i=0;i<N;i++)d.seg.push({x:x-Math.cos(a)*i*d.gap,y:y-Math.sin(a)*i*d.gap,a});
  paint(d);return d;
}
let drags=[];
const t0=performance.now();
[[.2,.3],[.8,.35],[.5,.75]].forEach(([fx,fy],j)=>{
  const k=1+Math.random()*.12;
  drags.push(makeMaiden({x:W*fx,y:H*fy,k,maxK:k,eye:EYES[[0,1,2][j]],now:t0,sk:SKINS[[2,0,4][j]]}));
});

const sparks=[];
// Newcomers: half fly in from beyond the screen edge, half descend through a burst of light
let nextStray=performance.now()+2000+Math.random()*2000;
function stray(now){
  const side=Math.floor(Math.random()*4),m=160;
  const x=side===0?-m:side===1?W+m:Math.random()*W;
  const y=side===2?-m:side===3?H+m:Math.random()*H;
  const k=.7+Math.random()*.45,eye=pick(EYES);
  if(Math.random()<.5){
    const angle=Math.atan2(H/2-y,W/2-x);            // gown trails outward, head points in
    drags.push(makeMaiden({x,y,k,maxK:k,eye,now,angle}));
  }else{
    const px=W*(.15+Math.random()*.7),py=H*(.15+Math.random()*.5),d=makeMaiden({x:px,y:py,k,maxK:k,eye,now,angle:Math.PI/2,portal:true});
    drags.push(d);
    for(let i=0;i<36;i++){const a=Math.random()*7,v=1+Math.random()*5;sparks.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:d.sk.g})}
  }
}
// Ascension: at the end of her time a maiden rises into the sky and becomes a star
let A=1;                                            // fade of the maiden being drawn
function ascend(d,now,dt){
  if(!d.asc){
    if(d.skin>=1&&d.k>=d.maxK&&now-d.born>d.lifespan){d.asc=.001;
      const h=d.seg[0];for(let i=0;i<24;i++){const a=Math.random()*7,v=1+Math.random()*3;sparks.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:d.sk.g})}}
    return false;
  }
  d.asc+=dt/7000;
  if(!reduce&&Math.random()<.6){const s=d.seg[Math.floor(Math.random()*d.N)];sparks.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.6,vy:.4+Math.random()*.8,life:1,c:d.sk.g})}
  if(d.asc>=1||d.seg[d.N-1].y<-120){
    const old=stars.filter(s=>s.c);if(old.length>=60)stars.splice(stars.indexOf(old[0]),1);   // keep at most 60 maiden stars
    stars.push({x:Math.min(.98,Math.max(.02,d.seg[0].x/W)),y:.03+Math.random()*.3,r:1.4+d.k*1.2,p:Math.random()*7,c:d.sk.g,born:now});
    return true;                                    // remove from the swarm
  }
  return false;
}
function lifecycle(now,dt){
  drags=drags.filter(d=>!ascend(d,now,dt));
  if(now>=nextStray){if(drags.length<cap())stray(now);nextStray=now+(drags.length<8?1500:2500)+Math.random()*3000}
  for(const d of drags){
    if(now>d.skinStart&&d.skin<1)d.skin=Math.min(1,(now-d.skinStart)/d.skinDur);
  }
}

// Where each head should be. Live maidens get a slot number (by age), then:
//  cursor mode -> evenly spaced rings around the cursor, leaving a clear circle in the middle
//  idle mode   -> one of 5 formations, switched at random every 9 s
const CLEAR=105, RING_GAP=95, SPACING=100;
const FORMS=['Celestial Vortex','Atom Orbits','Infinity Chase','Rose Bloom','Supernova Pulse'];
let NLIVE=0, form=-1, formUntil=0;
function ringPos(i,n,cx,cy,R0,s0,squeeze){
  let ring=0,start=0,R=R0;
  for(;;){const capN=Math.max(1,Math.floor(2*Math.PI*R/SPACING));if(i<start+capN){
      const inRing=Math.min(capN,n-start),j=i-start;
      const a=(j+(ring%2?.5:0))/inRing*Math.PI*2+s0*.12*(ring%2?-1:1);
      const r=R*squeeze;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
    start+=capN;ring++;R+=RING_GAP;}
}
function slotTarget(d,now,idle){
  const s0=now/1000,i=d.slot,n=Math.max(1,NLIVE),u=n>1?i/(n-1):.5;
  const S=Math.min(W,H),cx=W/2,cy=H/2;
  if(!idle){
    const [tx,ty]=ringPos(i,n,cursor.x,cursor.y,CLEAR,s0,1-d.lunge*.45);
    return {tx,ty,lx:cursor.x,ly:cursor.y};
  }
  // dynamic formations: every maiden races along a moving path and faces where it is flying
  const p0=flight(form,i,n,s0,S,cx,cy),p1=flight(form,i,n,s0+.12,S,cx,cy);
  const vx=p1[0]-p0[0],vy=p1[1]-p0[1],vl=Math.hypot(vx,vy)||1;
  return{tx:p0[0],ty:p0[1],lx:p0[0]+vx/vl*200,ly:p0[1]+vy/vl*200};
}
function flight(f,i,n,t,S,cx,cy){
  const q=i/n,TAU=Math.PI*2;
  switch(f){
    case 0:{ // Celestial Vortex: a whirlpool whose arms breathe in and out
      const a=q*TAU+t*1.6,r=S*(.08+.38*(.5+.5*Math.sin(t*.8+q*TAU*2)));
      return[cx+Math.cos(a)*r*W/S*.75,cy+Math.sin(a)*r]}
    case 1:{ // Atom Orbits: three tilted ellipses, maidens racing around each
      const orb=i%3,m=Math.ceil(n/3),j=Math.floor(i/3),dir=orb===1?-1:1;
      const th=t*1.5*dir+j/m*TAU,rot=orb*TAU/3+t*.12;
      const x=Math.cos(th)*S*.46,y=Math.sin(th)*S*.15;
      return[cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]}
    case 2:{ // Infinity Chase: one long chain chasing itself around a figure eight
      const th=t*1.1+q*TAU,d=1+Math.sin(th)**2,A=Math.min(W*.44,S*.8);
      return[cx+A*Math.cos(th)/d,cy+A*Math.sin(th)*Math.cos(th)/d*1.3]}
    case 3:{ // Rose Bloom: maidens trace the petals of a spinning 5-petal flower
      const th=t*.7+q*Math.PI,r=S*.44*Math.cos(5*th),rot=t*.25;
      return[cx+Math.cos(th+rot)*r,cy+Math.sin(th+rot)*r]}
    default:{ // Supernova Pulse: two waves burst outward and implode in turn, twisting as they go
      const pulse=.5+.5*Math.sin(t*1.3+(i%2)*Math.PI),r=S*(.06+.42*pulse),a=q*TAU+t*.35+pulse*1.6;
      return[cx+Math.cos(a)*r*W/S*.7,cy+Math.sin(a)*r]}
  }
}
const formEl=document.getElementById('form');
function plan(now){
  const live=drags.filter(d=>!d.asc).sort((a,b)=>a.id-b.id);
  live.forEach((d,i)=>d.slot=i);NLIVE=live.length;
  const idle=now-lastMove>2500;
  if(idle&&now>=formUntil){let f;do f=Math.floor(Math.random()*FORMS.length);while(f===form&&FORMS.length>1);
    form=f;formUntil=now+9000;formEl.textContent='Formation · '+FORMS[f];}
  if(!idle)formUntil=0;
  formEl.hidden=!idle;
  return idle;
}

const size=(d,i)=>{const t=i/(d.N-1);return d.k*Math.max(.18,1-t*t*.9-t*.1)};

function update(d,now,dt,idle){
  const h=d.seg[0];let tx,ty,lx,ly;
  if(d.asc){lx=h.x+Math.sin(now/600+d.phase)*40;ly=-2000;tx=lx;ty=ly}   // gaze and fly straight up
  else ({tx,ty,lx,ly}=slotTarget(d,now,idle));
  let dx=tx-h.x,dy=ty-h.y;
  if(!d.asc){
    // keep heads apart
    for(const o of drags){if(o===d||o.asc)continue;const ox=h.x-o.seg[0].x,oy=h.y-o.seg[0].y,od=Math.hypot(ox,oy),m=34*(d.k+o.k);
      if(od>0&&od<m){dx+=ox/od*(m-od);dy+=oy/od*(m-od)}}
    // keep the space around the cursor empty
    if(!idle){const ox=h.x-cursor.x,oy=h.y-cursor.y,od=Math.hypot(ox,oy),c=CLEAR*(1-d.lunge*.45)*.85;
      if(od>0&&od<c){dx+=ox/od*(c-od)*3;dy+=oy/od*(c-od)*3}}
  }
  const dist=Math.hypot(dx,dy);
  if(dist>1){
    // head glides to its spot around the cursor
    const step=d.asc?(2+d.asc*14)*Math.sqrt(d.k):idle?Math.min(dist*.35,28*Math.sqrt(d.k)):Math.min(dist*(d.speed+d.lunge*.25),(18+d.lunge*30)*Math.sqrt(d.k));
    h.x+=dx/dist*step;h.y+=dy/dist*step;
  }
  // skull always turns to face the cursor
  let diff=Math.atan2(ly-h.y,lx-h.x)-h.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  h.a+=diff*Math.min(1,(reduce?.15:idle?.35:.25)+d.lunge*.4);
  d.lunge*=.92;
  // rigid neck: first vertebra sits straight behind the skull
  const n1=d.seg[1];n1.a=h.a;n1.x=h.x-Math.cos(h.a)*d.gap;n1.y=h.y-Math.sin(h.a)*d.gap;
  for(let i=2;i<d.N;i++){
    const p=d.seg[i-1],s=d.seg[i];const a=Math.atan2(p.y-s.y,p.x-s.x);
    const wob=reduce?0:Math.sin(now/260-i*.35+d.phase)*.02*Math.min(1,dist/80);
    s.a=a+wob;const g=13*(.55+.45*size(d,i)/d.k)*d.k;
    s.x=p.x-Math.cos(s.a)*g;s.y=p.y-Math.sin(s.a)*g;
  }
  for(const f of d.feet){
    const s=d.seg[f.i],reach=46*size(d,f.i);
    const nx=-Math.sin(s.a)*f.s,ny=Math.cos(s.a)*f.s;
    const hx=s.x+nx*reach+Math.cos(s.a)*reach*.55,hy=s.y+ny*reach+Math.sin(s.a)*reach*.55;
    if(f.t>=1&&Math.hypot(hx-f.x,hy-f.y)>reach*.9){f.px=f.x;f.py=f.y;f.tx=hx+Math.cos(s.a)*reach*.3;f.ty=hy+Math.sin(s.a)*reach*.3;f.t=0}
    if(f.t<1){f.t=Math.min(1,f.t+dt/110);const e=f.t*f.t*(3-2*f.t);f.x=f.px+(f.tx-f.px)*e;f.y=f.py+(f.ty-f.py)*e}
  }
  if(d.blink<=0&&Math.random()<.002)d.blink=1;
  if(d.blink>0)d.blink=Math.max(0,d.blink-dt/140);
}


// ---------- drawing ----------
// Each maiden flies head-first: upper body drawn in a local frame (kept upright), hair and gown trail along the chain.
const FIG=2.1, G0=4;                     // figure scale; gown starts at the waist (chain index G0)
const upright=d=>Math.cos(d.seg[0].a)<0?-1:1;          // flip so she never flies upside down
function local(d){const h=d.seg[0];ctx.translate(h.x,h.y);ctx.rotate(h.a);ctx.scale(d.k*FIG,d.k*FIG*upright(d))}

function drawWings(d,now){           // translucent wings of light at the shoulders
  const h=d.seg[0],sh={x:h.x-Math.cos(h.a)*10*FIG*d.k,y:h.y-Math.sin(h.a)*10*FIG*d.k},sc=d.k*1.15;
  const flap=reduce?0:Math.sin(now/(420+d.k*120)+d.phase)*.3,sa=sv(d,0),g=d.sk.g;
  for(const side of [-1,1]){
    const a=h.a+Math.PI+side*(1.05+flap);
    for(let f=0;f<5;f++){
      const fa=a+side*(f*.17-.2),L=(62-f*7)*sc,w=(10-f)*sc;
      const ex=sh.x+Math.cos(fa)*L,ey=sh.y+Math.sin(fa)*L,nx=-Math.sin(fa)*w,ny=Math.cos(fa)*w;
      ctx.fillStyle=`rgba(${sa>0?g:'235,240,255'},${A*(.1+.12*sa)})`;
      ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.quadraticCurveTo((sh.x+ex)/2+nx,(sh.y+ey)/2+ny,ex,ey);
      ctx.quadraticCurveTo((sh.x+ex)/2-nx*.3,(sh.y+ey)/2-ny*.3,sh.x,sh.y);ctx.fill();
    }
  }
}

function hairLen(d,now){             // hair keeps growing longer as she ages
  return d.asc?1:Math.min(1,.55+.45*(now-d.born)/d.lifespan);
}
function drawHair(d,now){
  const end=Math.max(4,Math.floor(d.N*.75*hairLen(d,now))),h=d.seg[0];
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let st=-3;st<=3;st++){
    ctx.strokeStyle=st%2?d.hairCol:d.hairHi;ctx.lineWidth=(4.6-Math.abs(st)*.45)*d.k;
    ctx.beginPath();ctx.moveTo(h.x-Math.cos(h.a)*4*d.k,h.y-Math.sin(h.a)*4*d.k);
    for(let i=1;i<=end;i++){const s=d.seg[i],t=i/end;
      const o=(st*2.4*d.k)*(1+t*1.6)+(reduce?0:Math.sin(now/300-i*.55+d.phase+st)*3*d.k*t);
      ctx.lineTo(s.x-Math.sin(s.a)*o,s.y+Math.cos(s.a)*o)}
    ctx.stroke();
  }
}

function gownW(d,i){const t=(i-G0)/(d.N-G0-1);return d.k*(6+11*Math.pow(Math.sin(Math.min(1,t*1.05)*Math.PI*.92),1.2))}
function drawGown(d,now){            // long flowing gown along the chain, colors bloom from top to hem
  const L=[],R=[];
  for(let i=G0;i<d.N;i++){const s=d.seg[i],w=gownW(d,i)+(reduce?0:Math.sin(now/280-i*.6+d.phase)*1.6*d.k*(i/d.N));
    const nx=-Math.sin(s.a),ny=Math.cos(s.a);L.push([s.x+nx*w,s.y+ny*w]);R.push([s.x-nx*w,s.y-ny*w])}
  const path=()=>{ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(const p of L)ctx.lineTo(p[0],p[1]);
    for(let j=R.length-1;j>=0;j--)ctx.lineTo(R[j][0],R[j][1]);ctx.closePath()};
  ctx.fillStyle=d.robe;path();ctx.fill();
  // color bloom, segment by segment
  for(let j=0;j<L.length-1;j++){const i=j+G0,a=sv(d,i);if(a<=0)continue;
    ctx.globalAlpha=A*a;ctx.fillStyle=d.skinCols[i];
    ctx.beginPath();ctx.moveTo(L[j][0],L[j][1]);ctx.lineTo(L[j+1][0],L[j+1][1]);ctx.lineTo(R[j+1][0],R[j+1][1]);ctx.lineTo(R[j][0],R[j][1]);ctx.closePath();ctx.fill()}
  ctx.globalAlpha=A;

const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,p:Math.random()*7}));

// ===================== Living scenery: a day–night cycle that keeps rotating =====================
// One full day lasts DAY_SECONDS. Sky colors, light level and star visibility are interpolated between keyframes.
const DAY_SECONDS=160, START_HOUR=16.5;
const KEYS=[ // hour, sky top, sky at horizon, light (0 night .. 1 noon), stars
  [0,   [6,8,26],    [22,24,58],   .12,1],
  [4.6, [6,8,26],    [22,24,58],   .12,1],
  [5.5, [30,34,90],  [190,110,140],.3, .55],
  [6.4, [70,100,180],[255,170,110],.55,.1],
  [8,   [95,155,225],[235,225,200],.85,0],
  [12,  [60,130,230],[175,215,250],1,  0],
  [16,  [75,140,220],[225,220,190],.92,0],
  [17.5,[85,110,190],[255,190,120],.75,0],
  [18.5,[60,55,130], [255,115,70], .55,.05],
  [19.3,[28,28,78],  [160,70,110], .3, .45],
  [20.5,[6,8,26],    [22,24,58],   .12,1],
  [24,  [6,8,26],    [22,24,58],   .12,1]];
const PHASES=[[0,'Night'],[5,'Dawn'],[6.4,'Sunrise'],[8,'Morning'],[11,'Midday'],[14,'Afternoon'],[17,'Golden hour'],[18.4,'Sunset'],[19.3,'Dusk'],[20.5,'Night']];
const SKY={hour:START_HOUR,top:[0,0,0],hor:[0,0,0],light:1,stars:0,night:0};
const SCENE={tint:null,tintAmt:0,layers:[],lights:[],clouds:[],birds:0,birdSize:1};
const T0=performance.now();
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function skyAt(now){
  const h=(START_HOUR+(now-T0)/1000/DAY_SECONDS*24)%24;
  let i=0;while(KEYS[i+1][0]<=h)i++;
  const a=KEYS[i],b=KEYS[i+1],f=(h-a[0])/(b[0]-a[0]),e=f*f*(3-2*f);
  SKY.hour=h;SKY.top=mix(a[1],b[1],e);SKY.hor=mix(a[2],b[2],e);
  if(SCENE.tint){SKY.top=mix(SKY.top,SCENE.tint,SCENE.tintAmt);SKY.hor=mix(SKY.hor,SCENE.tint,SCENE.tintAmt*.6)}
  SKY.light=lerp(a[3],b[3],e);SKY.stars=lerp(a[4],b[4],e);SKY.night=clamp((.6-SKY.light)/.45,0,1);
}

// ---------- shape helpers (all return / fill Path2D) ----------
function ridge(p,base,amp,step,r){            // mountain or hill line across the screen, closed to the bottom
  const ph=[r()*7,r()*7,r()*7],f=x=>base-amp*(.5+.28*Math.sin(x/W*5+ph[0])+.14*Math.sin(x/W*13+ph[1])+.08*Math.sin(x/W*31+ph[2]));
  p.moveTo(-10,H+10);for(let x=-10;x<=W+step;x+=step)p.lineTo(x,f(x));p.lineTo(W+10,H+10);p.closePath();
  return f;
}
function roof(p,cx,y,w,h){                    // curved roof with upturned eaves (Asian style)
  p.moveTo(cx-w*.62,y-h*.32);p.quadraticCurveTo(cx-w*.46,y+h*.06,cx-w*.3,y);p.lineTo(cx+w*.3,y);
  p.quadraticCurveTo(cx+w*.46,y+h*.06,cx+w*.62,y-h*.32);p.quadraticCurveTo(cx+w*.26,y-h*.36,cx+w*.12,y-h);
  p.lineTo(cx-w*.12,y-h);p.quadraticCurveTo(cx-w*.26,y-h*.36,cx-w*.62,y-h*.32);p.closePath();
}
function gable(p,x,y,w,h){p.moveTo(x-w*.08,y);p.lineTo(x+w/2,y-h);p.lineTo(x+w*1.08,y);p.closePath()}
function mush(p,x,base,s){                    // giant mushroom silhouette
  p.moveTo(x-s*.12,base);p.quadraticCurveTo(x-s*.2,base-s*.6,x-s*.1,base-s*1.1);p.lineTo(x+s*.1,base-s*1.1);
  p.quadraticCurveTo(x+s*.06,base-s*.6,x+s*.14,base);p.closePath();
  p.moveTo(x-s*.8,base-s*1.05);p.ellipse(x,base-s*1.05,s*.8,s*.55,0,Math.PI,Math.PI*2);p.closePath();
}
const bobY=(b,now)=>b?Math.sin(now*b.sp+b.ph)*b.amp:0;

function layerColor(L){
  const c=mix(L.night,L.day,SKY.light);
  return mix(c,SKY.hor,L.haze*(.2+.35*(1-SKY.night)));
}
function drawLights(li,now){
  for(const l of SCENE.lights){
    if(l.layer!==li)continue;
    const on=clamp((SKY.night-l.th)/.2,0,1);if(on<=0)continue;
    const fl=l.flick?.8+.2*Math.sin(now*.013+l.x*.7):1,y=l.y+bobY(l.bob,now),a=on*fl;
    if(l.glow){const g=ctx.createRadialGradient(l.x,y,0,l.x,y,l.glow);g.addColorStop(0,rgba(l.c,.38*a));g.addColorStop(1,rgba(l.c,0));
      ctx.fillStyle=g;ctx.fillRect(l.x-l.glow,y-l.glow,l.glow*2,l.glow*2)}

    if(l.round){ctx.beginPath();ctx.arc(l.x,y,l.w,0,7);ctx.fill()}else ctx.fillRect(l.x-l.w/2,y-l.h/2,l.w,l.h);
  }
}

// ---------- shared sky pieces ----------
const skyStars=Array.from({length:180},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.2+.2,p:Math.random()*7}));
function buildClouds(r){
  SCENE.clouds=Array.from({length:Math.round(5+W/220)},()=>({x:r(),y:.05+r()*.38,s:.6+r()*.9,v:(.000004+r()*.000008)*(r()<.5?1:-1),
    puffs:Array.from({length:5+Math.floor(r()*4)},(_,j)=>[(j-3)*28+r()*14,(r()-.5)*14,26+r()*22,14+r()*10])}));
}
function cloudColor(){
  const base=mix([34,38,70],[255,255,255],SKY.light),warm=1-Math.min(1,Math.abs(SKY.light-.55)*2.2);
  return mix(base,SKY.hor,.25+.35*warm);
}
function drawClouds(now){
  const c=cloudColor();
  for(const cl of SCENE.clouds){
    const x=((cl.x+now*cl.v)%1.4+1.4)%1.4*W-W*.2,y=cl.y*H;
    ctx.fillStyle=rgba(c,.55+.25*SKY.light);
    for(const [dx,dy,rx,ry] of cl.puffs){ctx.beginPath();ctx.ellipse(x+dx*cl.s,y+dy*cl.s,rx*cl.s,ry*cl.s,0,0,7);ctx.fill()}
  }
}
function drawSunMoon(){
  const S=Math.min(W,H),sp=(SKY.hour-5.7)/13.2;
  if(sp>-.06&&sp<1.06){
    const hi=Math.sin(clamp(sp,0,1)*Math.PI),x=W*(.1+.8*sp),y=H*(.8-.64*hi);
    const c=mix([255,120,50],[255,246,215],Math.min(1,hi*1.6)),R=S*.4;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,rgba(c,.5));g.addColorStop(.12,rgba(c,.22));g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
    ctx.fillStyle=rgb(c);ctx.beginPath();ctx.arc(x,y,S*.034,0,7);ctx.fill();
  }
  const mp=((SKY.hour-18.6+24)%24)/11.2;
  if(mp<1.04){
    const hi=Math.sin(clamp(mp,0,1)*Math.PI),x=W*(.14+.72*mp),y=H*(.76-.56*hi),r=S*.028,R=S*.22;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(205,220,255,${.22*SKY.stars+.04})`);g.addColorStop(1,'rgba(205,220,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
    ctx.fillStyle='#eef0f8';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(150,160,190,.35)';
    for(const [dx,dy,rr] of [[-.3,-.2,.22],[.25,.3,.16],[.1,-.45,.1],[-.1,.45,.12]]){ctx.beginPath();ctx.arc(x+dx*r,y+dy*r,rr*r,0,7);ctx.fill()}
  }
}
function drawBirds(now){
  if(!SCENE.birds)return;
  const vis=clamp((SKY.light-.45)/.3,0,1);if(vis<=0)return;
  ctx.strokeStyle=rgba(mix([40,40,60],SKY.top,.25),.75*vis);ctx.lineCap='round';
  for(let i=0;i<SCENE.birds;i++){
    const t=((now*.00002*(1+i*.13)+i*.37)%1.3)-.15,x=t*W,y=H*(.16+.05*i+.03*Math.sin(now*.0008+i)),s=(6+i%3*2)*SCENE.birdSize;
    const fl=Math.sin(now*.012+i*2)*s*.6;
    ctx.lineWidth=1.6*SCENE.birdSize;ctx.beginPath();ctx.moveTo(x-s,y-fl);ctx.quadraticCurveTo(x-s*.4,y-s*.3,x,y);ctx.quadraticCurveTo(x+s*.4,y-s*.3,x+s,y-fl);ctx.stroke();
  }
}
const clockEl=document.getElementById('clock');let clockShown='';
function drawScene(now,skyHook){
  skyAt(now);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(SKY.top));g.addColorStop(.55,rgb(mix(SKY.top,SKY.hor,.55)));g.addColorStop(.82,rgb(SKY.hor));g.addColorStop(1,rgb(SKY.hor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(SKY.stars>.01)for(const s of skyStars){const tw=reduce?.7:.35+.65*Math.abs(Math.sin(now/1400+s.p));
    ctx.fillStyle=`rgba(230,236,255,${tw*.8*SKY.stars})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()}
  drawSunMoon();
  if(skyHook)skyHook(now);
  if(SCENE.sky)SCENE.sky(now);
  drawClouds(now);drawBirds(now);
  SCENE.layers.forEach((L,li)=>{
    if(L.custom){L.custom(now);return}
    const col=layerColor(L);ctx.fillStyle=rgb(col);
    for(const p of L.parts){const by=bobY(p.bob,now);if(by){ctx.save();ctx.translate(0,by);ctx.fill(p.path);ctx.restore()}else ctx.fill(p.path)}
    if(L.draw)L.draw(now,col);
    drawLights(li,now);
  });
  if(SCENE.front)SCENE.front(now);
  if(clockEl){const hh=Math.floor(SKY.hour),mm=Math.floor((SKY.hour%1)*6)*10;
    let ph='Night';for(const [h0,n] of PHASES)if(SKY.hour>=h0)ph=n;
    const txt=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${ph}`;
    if(txt!==clockShown){clockShown=txt;clockEl.textContent=txt}}
}
function smoke(now,x,y,col){                  // chimney smoke puffs
  for(let j=0;j<7;j++){const t=((now*.00035+j/7)%1),px=x+Math.sin(t*6+j)*5*t+t*18,py=y-t*70,r=3+t*12;
    ctx.fillStyle=rgba(col,(1-t)*.22);ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill()}
}

// ---------- Theme: hillside village & old town (castle on the hill, church, windmill, clock tower, street lamps) ----------
let mill=null,clock=null,chimneys=[];
function buildScene(){
  const r=rng(3301);SCENE.layers=[];SCENE.lights=[];chimneys=[];SCENE.birds=6;SCENE.birdSize=1;
  buildClouds(r);const S=Math.min(W,H),WIN=[255,205,120];
  // far hills with a castle
  const p0=new Path2D(),f0=ridge(p0,H*.6,H*.2,W/60,r);
  let cx=W*.7,best=1e9;for(let x=W*.55;x<W*.9;x+=8)if(f0(x)<best){best=f0(x);cx=x}
  const cb=f0(cx)+6,cs=S*.11;
  p0.rect(cx-cs*.6,cb-cs*.55,cs*1.2,cs*.55);
  for(const [dx,h,w] of [[-.6,.95,.22],[.6,.95,.22],[-.05,1.25,.28],[.3,.8,.18]]){
    const tx=cx+dx*cs,tw=cs*w;p0.rect(tx-tw/2,cb-cs*h,tw,cs*h);
    p0.moveTo(tx-tw*.65,cb-cs*h);p0.lineTo(tx,cb-cs*h-cs*.35);p0.lineTo(tx+tw*.65,cb-cs*h);p0.closePath();
    p0.rect(tx-.6,cb-cs*h-cs*.5,1.2,cs*.16);p0.moveTo(tx+.6,cb-cs*h-cs*.5);p0.lineTo(tx+cs*.1,cb-cs*h-cs*.46);p0.lineTo(tx+.6,cb-cs*h-cs*.42);p0.closePath();
    SCENE.lights.push({layer:0,x:tx,y:cb-cs*h*.7,w:Math.max(1.5,tw*.25),h:Math.max(2,tw*.35),c:WIN,th:r()*.5});
  }
  for(let k=0;k<6;k++)p0.rect(cx-cs*.6+k*cs*.22,cb-cs*.62,cs*.11,cs*.08);
  SCENE.layers.push({parts:[{path:p0}],day:[150,168,200],night:[22,24,54],haze:.8});
  // mid: village rooftops on a gentle slope, church spire and a windmill
  const p1=new Path2D(),f1=ridge(p1,H*.8,H*.06,W/50,r);
  let x=-20;
  while(x<W+20){
    const w=S*(.045+.04*r()),h=S*(.04+.04*r()),base=f1(x+w/2)+8;
    p1.rect(x,base-h,w,h+20);gable(p1,x,base-h,w,h*.7);
    if(r()<.6){p1.rect(x+w*.65,base-h-h*.55,w*.12,h*.35);chimneys.push([x+w*.71,base-h-h*.6,1])}
    for(let k=0;k<2;k++)SCENE.lights.push({layer:1,x:x+w*(.3+.4*k),y:base-h*.5,w:w*.14,h:h*.22,c:WIN,th:r()*.7});
    x+=w+S*(.004+.02*r());
  }
  const chx=W*.36,chb=f1(chx)+8,chs=S*.07;
  p1.rect(chx-chs*.5,chb-chs,chs,chs+20);gable(p1,chx-chs*.5,chb-chs,chs,chs*.5);
  p1.rect(chx+chs*.2,chb-chs*1.9,chs*.3,chs*1.9);p1.moveTo(chx+chs*.15,chb-chs*1.9);p1.lineTo(chx+chs*.35,chb-chs*2.9);p1.lineTo(chx+chs*.55,chb-chs*1.9);p1.closePath();
  p1.rect(chx+chs*.34,chb-chs*3.1,chs*.02+1,chs*.22);p1.rect(chx+chs*.28,chb-chs*3.03,chs*.14,chs*.025+1);
  SCENE.lights.push({layer:1,x:chx,y:chb-chs*.55,w:chs*.16,h:chs*.32,c:[255,180,110],th:.1});
  mill={x:W*.1,y:f1(W*.1)+8,s:S*.09};
  p1.moveTo(mill.x-mill.s*.25,mill.y);p1.lineTo(mill.x-mill.s*.15,mill.y-mill.s);p1.lineTo(mill.x+mill.s*.15,mill.y-mill.s);p1.lineTo(mill.x+mill.s*.25,mill.y);p1.closePath();
  p1.moveTo(mill.x-mill.s*.2,mill.y-mill.s);p1.lineTo(mill.x,mill.y-mill.s*1.25);p1.lineTo(mill.x+mill.s*.2,mill.y-mill.s);p1.closePath();
  SCENE.layers.push({parts:[{path:p1}],day:[112,118,146],night:[16,16,36],haze:.45,draw:(now,col)=>{
    const hx=mill.x,hy=mill.y-mill.s*1.02,a=reduce?0:now*.0012;ctx.fillStyle=rgb(col);
    for(let k=0;k<4;k++){ctx.save();ctx.translate(hx,hy);ctx.rotate(a+k*Math.PI/2);ctx.fillRect(-mill.s*.025,0,mill.s*.05,mill.s*.75);ctx.fillRect(-mill.s*.025,mill.s*.2,mill.s*.14,mill.s*.55);ctx.restore()}
    for(const [sx,sy] of chimneys)smoke(now,sx,sy,mix([200,200,210],SKY.hor,.3));
  }});
  // near: old-town street, townhouses, clock tower and street lamps
  const p2=new Path2D();x=-10;const base=H+2,houses=[];
  while(x<W+10){const w=S*(.1+.07*r()),h=H*(.11+.08*r());houses.push([x,w,h]);x+=w+S*(.05+.06*r())}
  const tw=S*.075,tx=W*.58,th=H*.38;
  for(const [hx0,w,h] of houses){
    if(Math.abs(hx0+w/2-tx)<tw*1.3)continue;
    p2.rect(hx0,base-h,w,h);
    if(r()<.5)gable(p2,hx0,base-h,w,h*.35);else{for(let k=0;k<4;k++)p2.rect(hx0+w*.5-w*(.5-k*.12),base-h-h*(k+1)*.08,w*(1-k*.24),h*.08)}
    for(let row=0;row<2;row++)for(let col=0;col<3;col++)SCENE.lights.push({layer:2,x:hx0+w*(.2+.3*col),y:base-h*(.75-.33*row),w:w*.12,h:h*.18,c:WIN,th:r()*.8});
  }
  p2.rect(tx-tw/2,base-th,tw,th);p2.moveTo(tx-tw*.62,base-th);p2.lineTo(tx,base-th-tw*1.1);p2.lineTo(tx+tw*.62,base-th);p2.closePath();
  clock={x:tx,y:base-th+tw*.62,r:tw*.32};
  for(let k=0;k<Math.round(W/240)+2;k++){const lx=(k+.5)/(Math.round(W/240)+2)*W;
    p2.rect(lx-1.5,base-S*.17,3,S*.17);p2.moveTo(lx-S*.012,base-S*.17);p2.lineTo(lx,base-S*.185);p2.lineTo(lx+S*.012,base-S*.17);p2.closePath();
    SCENE.lights.push({layer:2,x:lx,y:base-S*.163,w:S*.008,round:1,c:[255,215,140],th:0,glow:S*.09,flick:1})}
  SCENE.layers.push({parts:[{path:p2}],day:[74,66,82],night:[10,9,20],haze:.08,draw:(now,col)=>{
    // the clock face shows the scene's time of day
    const lit=SKY.night;ctx.fillStyle=rgb(mix([225,220,200],[255,225,150],lit));
    ctx.beginPath();ctx.arc(clock.x,clock.y,clock.r,0,7);ctx.fill();
    if(lit>0){const g=ctx.createRadialGradient(clock.x,clock.y,0,clock.x,clock.y,clock.r*3);g.addColorStop(0,`rgba(255,220,140,${.3*lit})`);g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;ctx.fillRect(clock.x-clock.r*3,clock.y-clock.r*3,clock.r*6,clock.r*6)}
    ctx.strokeStyle='#2a2430';ctx.lineCap='round';
    const hA=(SKY.hour%12)/12*Math.PI*2-Math.PI/2,mA=(SKY.hour%1)*Math.PI*2-Math.PI/2;
    ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(clock.x,clock.y);ctx.lineTo(clock.x+Math.cos(hA)*clock.r*.5,clock.y+Math.sin(hA)*clock.r*.5);ctx.stroke();
    ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(clock.x,clock.y);ctx.lineTo(clock.x+Math.cos(mA)*clock.r*.8,clock.y+Math.sin(mA)*clock.r*.8);ctx.stroke();
  }});
}
buildScene();addEventListener('resize',buildScene);

function drawBg(now){
  drawScene(now,()=>{ // stars left behind by those who ascended stay in the sky
    const v=.35+.65*SKY.stars;
    for(const s of stars){if(!s.c)continue;const tw=reduce?.6:.35+.65*Math.abs(Math.sin(now/1400+s.p));
      const g=Math.min(1,(now-s.born)/1500),R=s.r*5*g;
      const rg=ctx.createRadialGradient(s.x*W,s.y*H,0,s.x*W,s.y*H,R);rg.addColorStop(0,`rgba(${s.c},${.55*tw*v})`);rg.addColorStop(1,`rgba(${s.c},0)`);
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(s.x*W,s.y*H,R,0,7);ctx.fill();
      ctx.fillStyle=`rgba(255,255,255,${(.6+.4*tw)*v})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*g,0,7);ctx.fill()}
  });
  if(reduce)return;
  const mv=.25+.75*SKY.stars;
  for(const m of motes){m.y-=m.v*.0006;if(m.y<0){m.y=1;m.x=Math.random()}
    ctx.fillStyle=`rgba(${m.e},${.38*mv})`;ctx.beginPath();ctx.arc(m.x*W+Math.sin(now/1500+m.v*9)*12,m.y*H,m.r,0,7);ctx.fill()}
}

const countEl=document.getElementById('count');let shown=-1;
let prev=performance.now();
function frame(now){
  const dt=Math.min(50,now-prev);prev=now;
  lifecycle(now,dt);
  const idle=plan(now);
  for(const d of drags)update(d,now,dt,idle);
  if(idle&&!reduce)for(const d of drags){if(d.asc||Math.random()>.35)continue;
    const s=d.seg[Math.floor(Math.random()*Math.min(d.N,8))];
    sparks.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,life:.8,c:Math.random()<.5?d.sk.g:d.eye[1]})}
  drags.sort((a,b)=>a.k-b.k);                       // small ones behind, big ones in front
  drawBg(now);
  for(const d of drags){A=d.asc?Math.max(0,1-Math.max(0,d.asc-.35)/.65):1;ctx.globalAlpha=A;
    if(d.portal)A*=Math.min(1,(now-d.born)/900);ctx.globalAlpha=A;
    drawWings(d,now);drawGown(d,now);drawHair(d,now);drawUpper(d,now)}
  A=1;ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  for(const d of drags){A=d.asc?Math.max(0,1-Math.max(0,d.asc-.35)/.65):1;if(d.portal)A*=Math.min(1,(now-d.born)/900);ctx.globalAlpha=A*(1+(d.asc?Math.min(1,d.asc*3):0));drawAura(d,now);drawEyes(d,now)}
  A=1;ctx.globalAlpha=1;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.94;s.vy*=.94;s.life-=dt/700;
    if(s.life<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`rgba(${s.c},${s.life*.9})`;ctx.beginPath();ctx.arc(s.x,s.y,2.2*s.life+.4,0,7);ctx.fill()}
  if(drags.length!==shown){shown=drags.length;countEl.textContent=`${shown} maiden${shown>1?'s':''} · limit ${cap()}`}
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
