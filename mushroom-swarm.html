<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toxic Mushroom Swarm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed canvas forest floor at night, one quiet caption bottom-left */
:root{
  --bg:#080b0a; --flesh:#ece4d2; --toxic:#8cff3c; --muted:#6f8577;
  --display:"Creepster", "Chiller", Impact, fantasy;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--flesh);overflow:hidden;cursor:crosshair;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cap{position:fixed;left:0;bottom:0;pointer-events:none;
  padding:0 max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:4px}
.cap h1{margin:0;font:400 clamp(24px,4vw,36px)/1 var(--display);letter-spacing:.08em;color:var(--toxic);text-shadow:0 0 14px rgba(140,255,60,.45)}
.cap h1,.cap p{text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 12px rgba(0,0,0,.5)}
.cap p{margin:0;font:400 11px/1.4 var(--mono);letter-spacing:.08em;color:#c9cbd8;text-transform:uppercase}
</style>
<style>*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>

<canvas id="c" aria-label="A swarm of poisonous mushroom creatures that ripen, grow beards and follow your cursor"></canvas>
<div class="cap">
  <h1>Toxic Spore Swarm</h1>
  <p>Move your cursor · tap to make them spit spores</p>
  <p id="count">3 mushrooms</p>
  <p id="form" hidden></p>
  <p id="clock"></p>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const cursor={x:W/2,y:H/2}; let lastMove=-1e9, strike=0;
function setT(x,y){cursor.x=x;cursor.y=y;lastMove=performance.now()}
addEventListener('pointermove',e=>setT(e.clientX,e.clientY));
addEventListener('pointerdown',e=>{setT(e.clientX,e.clientY);strike=1;
  for(const d of drags){if(d.asc)continue;d.lunge=.7+Math.random()*.5;
    const h=d.seg[0],a=Math.atan2(cursor.y-h.y,cursor.x-h.x);           // spit a jet of toxic spores at the cursor
    for(let i=0;i<8;i++){const sp=a+(Math.random()-.5)*.5,v=3+Math.random()*4;sparks.push({x:h.x+Math.cos(a)*24*d.k,y:h.y+Math.sin(a)*24*d.k,vx:Math.cos(sp)*v,vy:Math.sin(sp)*v,life:1,c:d.eye[1]})}}});

// eye colours: [core, glow rgb]
const EYES=[
  ['#f2ffd6','140,255,60'],   // acid green
  ['#f6e3ff','185,70,255'],   // toxic purple
  ['#fffbd0','240,240,40'],   // radioactive yellow
  ['#ffe1f4','255,60,180'],   // magenta
  ['#dffcff','40,230,255'],   // cyan
  ['#ffdede','255,40,60'],    // blood red
  ['#fff0d6','255,140,30'],   // orange
  ['#ecfff4','150,255,210'],  // ghost mint
];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const BG=[8,11,10], FLESH=[236,228,210], FLESH2=[190,178,156], DARK=[70,58,54];

// Toxic species: a = cap/body color near the head, b = toward the tail, m = spots / gills / accents, g = glow, p = pattern
const SKINS=[
  {a:[205,30,35], b:[240,90,50], m:[255,250,235],g:'255,80,60', p:'spots'}, // fly agaric
  {a:[120,140,60],b:[190,200,120],m:[235,240,200],g:'170,230,90',p:'rings'}, // death cap
  {a:[235,240,245],b:[255,255,255],m:[190,255,230],g:'200,255,240',p:'glow'}, // destroying angel
  {a:[60,190,120],b:[170,255,190],m:[220,255,230],g:'90,255,160',p:'glow'}, // ghost fungus
  {a:[110,40,170],b:[200,90,230],m:[80,240,255], g:'190,90,255',p:'spots'}, // violet psilocybe
  {a:[220,170,20],b:[250,220,90],m:[140,200,40], g:'240,220,60',p:'rings'}, // sulphur tuft
  {a:[40,70,200], b:[90,140,255],m:[255,120,200],g:'90,140,255',p:'spots'}, // blue pinkgill
  {a:[235,110,20],b:[255,170,60],m:[255,230,120],g:'255,140,40',p:'glow'}, // jack-o'-lantern
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

// Life cycle: k = current size, maxK = adult size. Adults lay hatchlings at random intervals.
const K_MIN=.22, GROW=.04;                          // hatchling size, size gained per second
const cap=()=>W<600?12:W<1100?18:24;                // population limit so the page stays smooth
const breedDelay=()=>2000+Math.random()*4000;       // 2-6 s between hatchlings

function paint(d){                                  // small mushrooms sink into the dark
  const fade=Math.max(0,Math.min(1,(1.2-d.k)/.95))*.5;d.paintedK=d.k;
  d.flesh=rgb(mix(FLESH,BG,fade));d.flesh2=rgb(mix(FLESH2,BG,fade));d.dark=rgb(mix(DARK,BG,fade));
  const S=d.sk;
  d.skinCols=Array.from({length:d.N},(_,i)=>rgb(mix(mix(S.a,S.b,i/(d.N-1)),BG,fade)));
  d.belly=rgb(mix(mix(S.b,[255,255,255],.35),BG,fade));
  d.mane=rgb(mix(S.m,BG,fade));
  d.beardCol=rgb(mix(mix(S.m,[255,255,255],.7),BG,fade));
}
// skin grows from the head toward the tail
const sv=(d,i)=>Math.max(0,Math.min(1,d.skin*1.6-(i/d.N)*.6));
let nextId=0;
function makeMush({x,y,k,maxK,eye,now,angle,sk}){
  const N=Math.round(30+Math.random()*16);
  const d={id:nextId++,slot:0,k,maxK,N,gap:13*k,eye,sk:sk||pick(SKINS),skin:0,
    skinStart:now+1500+Math.random()*4000,skinDur:12000+Math.random()*14000,
    speed:.08+Math.random()*.07,
    orbitR:40+Math.random()*220,orbitW:(.3+Math.random()*.6)*(Math.random()<.5?-1:1),phase:Math.random()*7,
    lunge:0,blink:0,born:now,asc:0,lifespan:45000+Math.random()*45000,nextBreed:now+breedDelay(),seg:[],feet:[],ribs:Math.random()<.85};
  const a=angle??Math.random()*7;
  for(let i=0;i<N;i++)d.seg.push({x:x-Math.cos(a)*i*d.gap,y:y-Math.sin(a)*i*d.gap,a});
  d.legs=[Math.round(N*.16),Math.round(N*.46)];
  d.feet=d.legs.flatMap(i=>[-1,1].map(s=>({i,s,x,y,px:0,py:0,tx:0,ty:0,t:1})));
  paint(d);return d;
}
let drags=[];
const t0=performance.now();
[[.2,.3],[.8,.35],[.5,.75]].forEach(([fx,fy],j)=>{
  const k=1.05+Math.random()*.15;
  drags.push(makeMush({x:W*fx,y:H*fy,k,maxK:k,eye:EYES[[0,3,2][j]],now:t0,sk:SKINS[[0,3,4][j]]}));
});

const sparks=[];
function breed(p,now){
  const h=p.seg[Math.round(p.N*.35)];
  const eye=Math.random()<.5?p.eye:EYES[Math.floor(Math.random()*EYES.length)]; // half inherit the parent's eyes
  const sk=Math.random()<.4?p.sk:undefined;                                   // some inherit the parent's skin
  const baby=makeMush({x:h.x,y:h.y,k:K_MIN,maxK:.45+Math.random()*.8,eye,now,sk});
  drags.push(baby);
  for(let i=0;i<18;i++){const a=Math.random()*7,v=1+Math.random()*3;sparks.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:eye[1]})}
  p.nextBreed=now+breedDelay();
}
// Strays fly in from beyond the edge of the screen and join the swarm
let nextStray=performance.now()+2000+Math.random()*2000;
function stray(now){
  const side=Math.floor(Math.random()*4),m=160;
  const x=side===0?-m:side===1?W+m:Math.random()*W;
  const y=side===2?-m:side===3?H+m:Math.random()*H;
  const k=.4+Math.random()*.75;
  const angle=Math.atan2(H/2-y,W/2-x);              // body trails outward, head points in
  drags.push(makeMush({x,y,k,maxK:k,eye:EYES[Math.floor(Math.random()*EYES.length)],now,angle}));
}
// Spore release: an old, fully ripe mushroom drifts up, bursts into spores and reseeds the forest floor
let A=1;                                            // fade of the mushroom being drawn
function ascend(d,now,dt){
  if(!d.asc){
    if(d.skin>=1&&d.k>=d.maxK&&now-d.born>d.lifespan){d.asc=.001;
      const h=d.seg[0];for(let i=0;i<24;i++){const a=Math.random()*7,v=1+Math.random()*3;sparks.push({x:h.x,y:h.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:d.sk.g})}}
    return false;
  }
  d.asc+=dt/7000;
  if(!reduce&&Math.random()<.6){const s=d.seg[Math.floor(Math.random()*d.N)];sparks.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.6,vy:.4+Math.random()*.8,life:1,c:d.sk.g})}
  if(d.asc>=1||d.seg[d.N-1].y<-120){
    const h=d.seg[0];for(let i=0;i<30;i++){const a=Math.random()*7,v=1+Math.random()*4;sparks.push({x:h.x,y:Math.max(10,h.y),vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:d.sk.g})}
    if(sprouts.length>=60)sprouts.shift();                       // keep at most 60 forest-floor mushrooms
    const S=d.sk;sprouts.push({x:Math.min(.98,Math.max(.02,h.x/W)),h:10+d.k*16,c:rgb(S.a),m:rgb(S.m),g:S.g,born:now,lean:(Math.random()-.5)*.3,p:Math.random()*7});
    return true;                                    // remove from the swarm
  }
  return false;
}
function lifecycle(now,dt){
  drags=drags.filter(d=>!ascend(d,now,dt));
  if(now>=nextStray){if(drags.length<cap())stray(now);nextStray=now+2500+Math.random()*3500}
  for(const d of drags){
    if(now>d.skinStart&&d.skin<1)d.skin=Math.min(1,(now-d.skinStart)/d.skinDur);
    if(d.k<d.maxK){d.k=Math.min(d.maxK,d.k+GROW*dt/1000);d.gap=13*d.k;if(Math.abs(d.k-d.paintedK)>.02)paint(d)}
  }
  if(drags.length>=cap())return;
  for(const d of [...drags]){
    if(!d.asc&&d.k>=d.maxK&&now>=d.nextBreed&&drags.length<cap())breed(d,now);
  }
}

// Where each head should be. Live mushrooms get a slot number (by age), then:
//  cursor mode -> evenly spaced rings around the cursor, leaving a clear circle in the middle
//  idle mode   -> one of 5 formations, switched at random every 9 s
const CLEAR=90, RING_GAP=80, SPACING=85;
const FORMS=['Spore Vortex','Toxic Orbits','Infinity Creep','Fairy Ring Bloom','Spore Burst'];
let NLIVE=0, form=-1, formUntil=0;
function ringPos(i,n,cx,cy,R0,s0,squeeze){
  let ring=0,start=0,R=R0;
  for(;;){const capN=Math.max(1,Math.floor(2*Math.PI*R/SPACING));if(i<start+capN){
      const inRing=Math.min(capN,n-start),j=i-start;
      const a=(j+(ring%2?.5:0))/inRing*Math.PI*2+s0*.12*(ring%2?-1:1);
      const r=R*squeeze;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
    start+=capN;ring++;R+=RING_GAP;}
}
function slotTarget(d,now,idle){
  const s0=now/1000,i=d.slot,n=Math.max(1,NLIVE),u=n>1?i/(n-1):.5;
  const S=Math.min(W,H),cx=W/2,cy=H/2;
  if(!idle){
    const [tx,ty]=ringPos(i,n,cursor.x,cursor.y,CLEAR,s0,1-d.lunge*.45);
    return {tx,ty,lx:cursor.x,ly:cursor.y};
  }
  // dynamic formations: every mushroom races along a moving path and faces where it is flying
  const p0=flight(form,i,n,s0,S,cx,cy),p1=flight(form,i,n,s0+.12,S,cx,cy);
  const vx=p1[0]-p0[0],vy=p1[1]-p0[1],vl=Math.hypot(vx,vy)||1;
  return{tx:p0[0],ty:p0[1],lx:p0[0]+vx/vl*200,ly:p0[1]+vy/vl*200};
}
function flight(f,i,n,t,S,cx,cy){
  const q=i/n,TAU=Math.PI*2;
  switch(f){
    case 0:{ // Celestial Vortex: a whirlpool whose arms breathe in and out
      const a=q*TAU+t*1.6,r=S*(.08+.38*(.5+.5*Math.sin(t*.8+q*TAU*2)));
      return[cx+Math.cos(a)*r*W/S*.75,cy+Math.sin(a)*r]}
    case 1:{ // Atom Orbits: three tilted ellipses, mushrooms racing around each
      const orb=i%3,m=Math.ceil(n/3),j=Math.floor(i/3),dir=orb===1?-1:1;
      const th=t*1.5*dir+j/m*TAU,rot=orb*TAU/3+t*.12;
      const x=Math.cos(th)*S*.46,y=Math.sin(th)*S*.15;
      return[cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]}
    case 2:{ // Infinity Chase: one long chain chasing itself around a figure eight
      const th=t*1.1+q*TAU,d=1+Math.sin(th)**2,A=Math.min(W*.44,S*.8);
      return[cx+A*Math.cos(th)/d,cy+A*Math.sin(th)*Math.cos(th)/d*1.3]}
    case 3:{ // Rose Bloom: mushrooms trace the petals of a spinning 5-petal flower
      const th=t*.7+q*Math.PI,r=S*.44*Math.cos(5*th),rot=t*.25;
      return[cx+Math.cos(th+rot)*r,cy+Math.sin(th+rot)*r]}
    default:{ // Supernova Pulse: two waves burst outward and implode in turn, twisting as they go
      const pulse=.5+.5*Math.sin(t*1.3+(i%2)*Math.PI),r=S*(.06+.42*pulse),a=q*TAU+t*.35+pulse*1.6;
      return[cx+Math.cos(a)*r*W/S*.7,cy+Math.sin(a)*r]}
  }
}
const formEl=document.getElementById('form');
function plan(now){
  const live=drags.filter(d=>!d.asc).sort((a,b)=>a.id-b.id);
  live.forEach((d,i)=>d.slot=i);NLIVE=live.length;
  const idle=now-lastMove>2500;
  if(idle&&now>=formUntil){let f;do f=Math.floor(Math.random()*FORMS.length);while(f===form&&FORMS.length>1);
    form=f;formUntil=now+9000;formEl.textContent='Formation · '+FORMS[f];}
  if(!idle)formUntil=0;
  formEl.hidden=!idle;
  return idle;
}

const size=(d,i)=>{const t=i/(d.N-1);return d.k*Math.max(.18,1-t*t*.9-t*.1)};

function update(d,now,dt,idle){
  const h=d.seg[0];let tx,ty,lx,ly;
  if(d.asc){lx=h.x+Math.sin(now/600+d.phase)*40;ly=-2000;tx=lx;ty=ly}   // gaze and fly straight up
  else ({tx,ty,lx,ly}=slotTarget(d,now,idle));
  let dx=tx-h.x,dy=ty-h.y;
  if(!d.asc){
    // keep heads apart
    for(const o of drags){if(o===d||o.asc)continue;const ox=h.x-o.seg[0].x,oy=h.y-o.seg[0].y,od=Math.hypot(ox,oy),m=34*(d.k+o.k);
      if(od>0&&od<m){dx+=ox/od*(m-od);dy+=oy/od*(m-od)}}
    // keep the space around the cursor empty
    if(!idle){const ox=h.x-cursor.x,oy=h.y-cursor.y,od=Math.hypot(ox,oy),c=CLEAR*(1-d.lunge*.45)*.85;
      if(od>0&&od<c){dx+=ox/od*(c-od)*3;dy+=oy/od*(c-od)*3}}
  }
  const dist=Math.hypot(dx,dy);
  if(dist>1){
    // head glides to its spot around the cursor
    const step=d.asc?(2+d.asc*14)*Math.sqrt(d.k):idle?Math.min(dist*.35,28*Math.sqrt(d.k)):Math.min(dist*(d.speed+d.lunge*.25),(18+d.lunge*30)*Math.sqrt(d.k));
    h.x+=dx/dist*step;h.y+=dy/dist*step;
  }
  // skull always turns to face the cursor
  let diff=Math.atan2(ly-h.y,lx-h.x)-h.a;diff=Math.atan2(Math.sin(diff),Math.cos(diff));
  h.a+=diff*Math.min(1,(reduce?.15:idle?.35:.25)+d.lunge*.4);
  d.lunge*=.92;
  // rigid neck: first vertebra sits straight behind the skull
  const n1=d.seg[1];n1.a=h.a;n1.x=h.x-Math.cos(h.a)*d.gap;n1.y=h.y-Math.sin(h.a)*d.gap;
  for(let i=2;i<d.N;i++){
    const p=d.seg[i-1],s=d.seg[i];const a=Math.atan2(p.y-s.y,p.x-s.x);
    const wob=reduce?0:Math.sin(now/260-i*.35+d.phase)*.02*Math.min(1,dist/80);
    s.a=a+wob;const g=13*(.55+.45*size(d,i)/d.k)*d.k;
    s.x=p.x-Math.cos(s.a)*g;s.y=p.y-Math.sin(s.a)*g;
  }
  for(const f of d.feet){
    const s=d.seg[f.i],reach=46*size(d,f.i);
    const nx=-Math.sin(s.a)*f.s,ny=Math.cos(s.a)*f.s;
    const hx=s.x+nx*reach+Math.cos(s.a)*reach*.55,hy=s.y+ny*reach+Math.sin(s.a)*reach*.55;
    if(f.t>=1&&Math.hypot(hx-f.x,hy-f.y)>reach*.9){f.px=f.x;f.py=f.y;f.tx=hx+Math.cos(s.a)*reach*.3;f.ty=hy+Math.sin(s.a)*reach*.3;f.t=0}
    if(f.t<1){f.t=Math.min(1,f.t+dt/110);const e=f.t*f.t*(3-2*f.t);f.x=f.px+(f.tx-f.px)*e;f.y=f.py+(f.ty-f.py)*e}
  }
  if(d.blink<=0&&Math.random()<.002)d.blink=1;
  if(d.blink>0)d.blink=Math.max(0,d.blink-dt/140);
}


// ---------- drawing ----------
// Young mushrooms are pale and fleshy; ripeness (sv) floods them with their toxic colors from the cap back.
function drawVeil(d,now){            // frilly gill veil at the shoulders, flapping like wings
  const wi=Math.max(3,Math.round(d.N*.12)),s=d.seg[wi],sc=size(d,wi);
  const flap=reduce?0:Math.sin(now/(340+d.k*120)+d.phase)*.35;
  const back=d.seg[Math.round(d.N*.3)],sa=sv(d,wi);
  for(const side of [-1,1]){
    const a=s.a+side*(Math.PI/2+.5+flap);
    const L=32*sc,ex=s.x+Math.cos(a)*L,ey=s.y+Math.sin(a)*L;
    const tips=[0,1,2,3,4].map(k=>{const fa=a+side*(-.3+k*.34),fl=(42-k*5)*sc;return[ex+Math.cos(fa)*fl,ey+Math.sin(fa)*fl]});
    const outline=()=>{ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(ex,ey);
      tips.forEach(([x,y],k)=>{if(!k)ctx.lineTo(x,y);else{const [px,py]=tips[k-1];ctx.quadraticCurveTo((px+x)/2+(ex-(px+x)/2)*-.18,(py+y)/2+(ey-(py+y)/2)*-.18,x,y)}});
      ctx.lineTo(back.x,back.y);ctx.closePath()};
    ctx.fillStyle='rgba(236,228,210,.08)';outline();ctx.fill();
    if(sa>0){const m=d.sk.a;ctx.fillStyle=`rgba(${m[0]},${m[1]},${m[2]},${A*sa*.22})`;outline();ctx.fill()}
    // gill ribs
    ctx.strokeStyle=sa>.5?d.mane:d.flesh2;ctx.lineWidth=1.3*sc;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(ex,ey);tips.forEach(([x,y])=>{ctx.moveTo(ex,ey);ctx.lineTo(x,y)});ctx.stroke();
  }
}

function drawRoots(d){               // walking root tendrils with hairy root tips
  for(const f of d.feet){
    const s=d.seg[f.i],sc=size(d,f.i),L=34*sc;
    const dx=f.x-s.x,dy=f.y-s.y,dd=Math.min(Math.hypot(dx,dy),L*1.98);
    const base=Math.atan2(dy,dx),bend=Math.acos(Math.min(1,dd/(2*L)))*-f.s;
    const kx=s.x+Math.cos(base+bend)*L,ky=s.y+Math.sin(base+bend)*L;
    const fx=s.x+Math.cos(base)*dd,fy=s.y+Math.sin(base)*dd;
    const a=sv(d,f.i);
    ctx.lineCap='round';
    ctx.strokeStyle=d.flesh2;ctx.lineWidth=4.2*sc;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(kx,ky,fx,fy);ctx.stroke();
    if(a>0){ctx.globalAlpha=A*a;ctx.strokeStyle=d.skinCols[f.i];ctx.lineWidth=3*sc;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(kx,ky,fx,fy);ctx.stroke();ctx.globalAlpha=A}
    ctx.strokeStyle=a>.5?d.mane:d.flesh;ctx.lineWidth=1.1*sc;
    for(let c=-2;c<=2;c++){const ca=base+c*.42,l=(9+(2-Math.abs(c))*3)*sc;
      ctx.beginPath();ctx.moveTo(fx,fy);ctx.quadraticCurveTo(fx+Math.cos(ca+.4)*l*.6,fy+Math.sin(ca+.4)*l*.6,fx+Math.cos(ca)*l,fy+Math.sin(ca)*l);ctx.stroke()}
  }
}

function drawStalk(d,now){           // fleshy mycelium body with little mushrooms sprouting along it
  const r0=Math.round(d.N*.12),r1=Math.round(d.N*.75);
  for(let i=r0;i<=r1;i+=3){
    const s=d.seg[i],sc=size(d,i),side=((i-r0)/3)%2?1:-1,a=sv(d,i);
    const sway=reduce?0:Math.sin(now/500+i+d.phase)*.25;
    const ang=s.a+side*(Math.PI/2+.35)+sway,len=(10+Math.sin((i-r0)/(r1-r0)*Math.PI)*12)*sc;
    const tx=s.x+Math.cos(ang)*len,ty=s.y+Math.sin(ang)*len;
    ctx.strokeStyle=d.flesh;ctx.lineWidth=2.2*sc;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(tx,ty);ctx.stroke();
    ctx.save();ctx.translate(tx,ty);ctx.rotate(ang);
    const cr=5.5*sc;
    ctx.fillStyle=d.flesh;ctx.beginPath();ctx.ellipse(0,0,cr*.75,cr*1.25,0,-Math.PI/2,Math.PI/2);ctx.closePath();ctx.fill();
    if(a>0){ctx.globalAlpha=A*a;ctx.fillStyle=d.skinCols[i];ctx.beginPath();ctx.ellipse(0,0,cr*.75,cr*1.25,0,-Math.PI/2,Math.PI/2);ctx.closePath();ctx.fill();
      if(d.sk.p==='spots'){ctx.fillStyle=d.mane;ctx.beginPath();ctx.arc(cr*.35,-cr*.4,cr*.17,0,7);ctx.arc(cr*.3,cr*.45,cr*.14,0,7);ctx.fill()}
      ctx.globalAlpha=A}
    ctx.restore();
  }
  // body tube with fibrous nodes
  for(let i=d.N-1;i>0;i--){
    const s=d.seg[i],r=6.5*size(d,i)*1.25;
    ctx.fillStyle=d.flesh;ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fill();
    if(i%2===0){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.strokeStyle=d.flesh2;ctx.lineWidth=Math.max(.6,r*.14);
      ctx.beginPath();ctx.ellipse(-r*.15,0,r*.35,r*.85,0,-1.3,1.3);ctx.stroke();ctx.restore()}
  }
  // root-tuft tail
  const e=d.seg[d.N-1];ctx.strokeStyle=d.flesh2;ctx.lineWidth=1.3*d.k;
  for(let j=-2;j<=2;j++){const w=reduce?0:Math.sin(now/350+j+d.phase)*.25,ang=e.a+Math.PI+j*.3+w,L=(26-Math.abs(j)*4)*d.k;
    ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.quadraticCurveTo(e.x+Math.cos(ang-.4)*L*.5,e.y+Math.sin(ang-.4)*L*.5,e.x+Math.cos(ang)*L,e.y+Math.sin(ang)*L);ctx.stroke()}
}

function drawToxin(d,now){           // ripeness: toxic color and pattern spread over the body
  if(d.skin<=0)return;
  const P=d.sk.p;
  for(let i=d.N-1;i>=1;i--){
    const a=sv(d,i);if(a<=0)continue;
    const s=d.seg[i],r=6.5*size(d,i)*1.25;
    ctx.globalAlpha=A*a;ctx.fillStyle=d.skinCols[i];ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fill();
  }
  for(let i=d.N-1;i>=1;i--){
    const a=sv(d,i);if(a<=0)continue;
    const s=d.seg[i],r=6.5*size(d,i)*1.25;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.globalAlpha=A*a;
    if(P==='spots'&&i%2===0){ctx.fillStyle=d.mane;const o=((i*7)%5-2)*r*.22;ctx.beginPath();ctx.arc(0,o,r*.24,0,7);ctx.fill()}
    if(P==='rings'&&i%3===0){ctx.strokeStyle=d.mane;ctx.lineWidth=Math.max(.8,r*.22);ctx.beginPath();ctx.ellipse(0,0,r*.25,r*.95,0,0,7);ctx.stroke()}
    if(P==='glow'&&i%2===0){ctx.fillStyle=d.belly;ctx.beginPath();ctx.ellipse(0,0,r*.6,r*.2,0,0,7);ctx.fill()}
    ctx.restore();
  }
  ctx.globalAlpha=A;
}

const CAP=1.4;                         // caps are drawn larger than the body so they read as mushrooms
function capPath(p){                 // mushroom cap seen from the side, dome pointing forward (+x)
  ctx.beginPath();ctx.moveTo(2,-22*p);ctx.bezierCurveTo(14,-25*p,29,-13*p,29,0);
  ctx.bezierCurveTo(29,13*p,14,25*p,2,22*p);ctx.quadraticCurveTo(-4,0,2,-22*p);ctx.closePath();
}
function drawCap(d,now){
  const h=d.seg[0];ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.a);ctx.scale(d.k*CAP,d.k*CAP);
  const p=1+d.lunge*.22+(reduce?0:Math.sin(now/700+d.phase)*.03);  // cap puffs up when spitting
  const a0=sv(d,0);
  // hanging hyphae beard grows with age (from 35% of the lifespan)
  const age=d.asc?1:Math.max(0,Math.min(1,((now-d.born)/d.lifespan-.35)/.65));
  if(age>0){
    ctx.strokeStyle=d.beardCol;ctx.lineCap='round';
    for(let j=-4;j<=4;j++){
      const w=reduce?0:Math.sin(now/520+d.phase+j*.8)*8*age,L=(38+(4-Math.abs(j))*10)*age;
      ctx.lineWidth=1.8-Math.abs(j)*.18;ctx.globalAlpha=A*(.5+.5*age);
      ctx.beginPath();ctx.moveTo(3,j*4);ctx.bezierCurveTo(-6,j*5+w*.3,-L*.45,j*7+w,-L,j*(8+age*5)+w*1.4);ctx.stroke();
    }
    ctx.globalAlpha=A;
  }
  // stem (neck)
  ctx.fillStyle=d.flesh;ctx.beginPath();ctx.moveTo(-16,-7);ctx.lineTo(4,-8);ctx.lineTo(4,8);ctx.lineTo(-16,7);ctx.closePath();ctx.fill();
  // ring (annulus) around the stem
  ctx.fillStyle=d.flesh2;ctx.beginPath();ctx.ellipse(-5,0,3,11,0,0,7);ctx.fill();
  if(a0>0){ctx.globalAlpha=A*a0;ctx.fillStyle=d.mane;ctx.beginPath();ctx.ellipse(-5,0,3,11,0,0,7);ctx.fill();ctx.globalAlpha=A}
  // cap
  ctx.fillStyle=d.flesh;capPath(p);ctx.fill();
  if(a0>0){ctx.globalAlpha=A*a0;ctx.fillStyle=d.skinCols[0];capPath(p);ctx.fill();
    // pattern on the cap
    ctx.fillStyle=d.mane;
    if(d.sk.p==='spots'){for(const [x,y,r] of [[20,-9,2.6],[24,6,2.2],[13,-16,2],[12,14,2.4],[18,1,1.6],[8,-4,1.4]]){ctx.beginPath();ctx.arc(x,y*p,r,0,7);ctx.fill()}}
    if(d.sk.p==='rings'){ctx.strokeStyle=d.mane;ctx.lineWidth=1.3;for(const k of [.55,.8]){ctx.beginPath();ctx.ellipse(2,0,27*k,22*p*k,0,-1.2,1.2);ctx.stroke()}}
    if(d.sk.p==='glow'){ctx.fillStyle=d.belly;ctx.beginPath();ctx.ellipse(18,0,7,14*p,0,0,7);ctx.fill()}
    ctx.globalAlpha=A}
  // highlight
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.ellipse(20,-8*p,5,3,-.5,0,7);ctx.fill();
  // gills under the cap
  ctx.strokeStyle=a0>.5?d.mane:d.flesh2;ctx.lineWidth=.8;
  for(let y=-18;y<=18;y+=3){ctx.beginPath();ctx.moveTo(1+Math.abs(y)*.08,y*p);ctx.lineTo(6,y*p*.85);ctx.stroke()}
  // mouth slit opens when spitting
  const jaw=.08+d.lunge*.9+(reduce?0:Math.max(0,Math.sin(now/900+d.phase))*.12);
  ctx.fillStyle='#080605';ctx.beginPath();ctx.ellipse(27*p,0,1.8,2+jaw*9,0,0,7);ctx.fill();
  // eye sockets
  for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(16,s*8*p,3.6,2.6,s*.25,0,7);ctx.fill()}
  ctx.restore();
}

// Toxic glow and bioluminescent freckles on ripe mushrooms (additive pass)
function drawAura(d,now){
  if(d.skin<=0)return;
  const g=d.sk.g;
  for(let i=0;i<d.N;i+=3){
    const a=sv(d,i);if(a<=0)continue;const s=d.seg[i],r=6.5*size(d,i);
    ctx.fillStyle=`rgba(${g},${.05*a})`;ctx.beginPath();ctx.arc(s.x,s.y,r*3.2,0,7);ctx.fill();
  }
  const h=d.seg[0],a0=sv(d,0);
  if(a0>0){const R=44*d.k,cx=h.x+Math.cos(h.a)*20*d.k,cy=h.y+Math.sin(h.a)*20*d.k;
    const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,R);rg.addColorStop(0,`rgba(${g},${.18*a0})`);rg.addColorStop(1,`rgba(${g},0)`);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill()}
  if(d.sk.p==='glow'){
    for(let i=2;i<d.N;i+=2){
      const a=sv(d,i);if(a<=0)continue;const s=d.seg[i],r=6.5*size(d,i);
      const tw=reduce?.7:.4+.6*Math.abs(Math.sin(now/500+i*1.7+d.phase));
      const off=((i*37)%10/10-.5)*r*1.6;
      ctx.fillStyle=`rgba(${g},${tw*a})`;
      ctx.beginPath();ctx.arc(s.x-Math.sin(s.a)*off,s.y+Math.cos(s.a)*off,Math.max(.8,r*.2),0,7);ctx.fill();
    }
  }
}

function drawEyes(d,now){
  const h=d.seg[0],k=d.k,c=Math.cos(h.a),s=Math.sin(h.a);
  const p=1+d.lunge*.22;
  const pulse=reduce?1:.8+.2*Math.sin(now/300+d.phase*3);
  const open=1-Math.sin(d.blink*Math.PI);
  const glow=(1+d.lunge*.8)*pulse*open;
  if(glow<.05)return;
  for(const side of [-1,1]){
    const lx=16*k*CAP,ly=side*8*p*k*CAP,x=h.x+lx*c-ly*s,y=h.y+lx*s+ly*c;
    const R=22*k*glow;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,`rgba(${d.eye[1]},.9)`);g.addColorStop(.3,`rgba(${d.eye[1]},.35)`);g.addColorStop(1,`rgba(${d.eye[1]},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    ctx.fillStyle=d.eye[0];ctx.beginPath();ctx.ellipse(x,y,2.4*k,1.4*k*open,h.a+side*.3,0,7);ctx.fill();
  }
}

// Forest at night: drifting fog, rising spores, and the mushrooms that reseeded the ground
const sprouts=[];
const fog=Array.from({length:7},(_,i)=>({x:Math.random(),y:.2+Math.random()*.8,r:.25+Math.random()*.3,v:(Math.random()-.5)*.00004,c:i%2?'120,255,120':'170,80,255'}));
const motes=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),v:.15+Math.random()*.5,r:Math.random()*1.5+.3,e:EYES[Math.floor(Math.random()*EYES.length)][1]}));

// ===================== Living scenery: a day–night cycle that keeps rotating =====================
// One full day lasts DAY_SECONDS. Sky colors, light level and star visibility are interpolated between keyframes.
const DAY_SECONDS=160, START_HOUR=16.5;
const KEYS=[ // hour, sky top, sky at horizon, light (0 night .. 1 noon), stars
  [0,   [6,8,26],    [22,24,58],   .12,1],
  [4.6, [6,8,26],    [22,24,58],   .12,1],
  [5.5, [30,34,90],  [190,110,140],.3, .55],
  [6.4, [70,100,180],[255,170,110],.55,.1],
  [8,   [95,155,225],[235,225,200],.85,0],
  [12,  [60,130,230],[175,215,250],1,  0],
  [16,  [75,140,220],[225,220,190],.92,0],
  [17.5,[85,110,190],[255,190,120],.75,0],
  [18.5,[60,55,130], [255,115,70], .55,.05],
  [19.3,[28,28,78],  [160,70,110], .3, .45],
  [20.5,[6,8,26],    [22,24,58],   .12,1],
  [24,  [6,8,26],    [22,24,58],   .12,1]];
const PHASES=[[0,'Night'],[5,'Dawn'],[6.4,'Sunrise'],[8,'Morning'],[11,'Midday'],[14,'Afternoon'],[17,'Golden hour'],[18.4,'Sunset'],[19.3,'Dusk'],[20.5,'Night']];
const SKY={hour:START_HOUR,top:[0,0,0],hor:[0,0,0],light:1,stars:0,night:0};
const SCENE={tint:null,tintAmt:0,layers:[],lights:[],clouds:[],birds:0,birdSize:1};
const T0=performance.now();
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function skyAt(now){
  const h=(START_HOUR+(now-T0)/1000/DAY_SECONDS*24)%24;
  let i=0;while(KEYS[i+1][0]<=h)i++;
  const a=KEYS[i],b=KEYS[i+1],f=(h-a[0])/(b[0]-a[0]),e=f*f*(3-2*f);
  SKY.hour=h;SKY.top=mix(a[1],b[1],e);SKY.hor=mix(a[2],b[2],e);
  if(SCENE.tint){SKY.top=mix(SKY.top,SCENE.tint,SCENE.tintAmt);SKY.hor=mix(SKY.hor,SCENE.tint,SCENE.tintAmt*.6)}
  SKY.light=lerp(a[3],b[3],e);SKY.stars=lerp(a[4],b[4],e);SKY.night=clamp((.6-SKY.light)/.45,0,1);
}

// ---------- shape helpers (all return / fill Path2D) ----------
function ridge(p,base,amp,step,r){            // mountain or hill line across the screen, closed to the bottom
  const ph=[r()*7,r()*7,r()*7],f=x=>base-amp*(.5+.28*Math.sin(x/W*5+ph[0])+.14*Math.sin(x/W*13+ph[1])+.08*Math.sin(x/W*31+ph[2]));
  p.moveTo(-10,H+10);for(let x=-10;x<=W+step;x+=step)p.lineTo(x,f(x));p.lineTo(W+10,H+10);p.closePath();
  return f;
}
function roof(p,cx,y,w,h){                    // curved roof with upturned eaves (Asian style)
  p.moveTo(cx-w*.62,y-h*.32);p.quadraticCurveTo(cx-w*.46,y+h*.06,cx-w*.3,y);p.lineTo(cx+w*.3,y);
  p.quadraticCurveTo(cx+w*.46,y+h*.06,cx+w*.62,y-h*.32);p.quadraticCurveTo(cx+w*.26,y-h*.36,cx+w*.12,y-h);
  p.lineTo(cx-w*.12,y-h);p.quadraticCurveTo(cx-w*.26,y-h*.36,cx-w*.62,y-h*.32);p.closePath();
}
function gable(p,x,y,w,h){p.moveTo(x-w*.08,y);p.lineTo(x+w/2,y-h);p.lineTo(x+w*1.08,y);p.closePath()}
function mush(p,x,base,s){                    // giant mushroom silhouette
  p.moveTo(x-s*.12,base);p.quadraticCurveTo(x-s*.2,base-s*.6,x-s*.1,base-s*1.1);p.lineTo(x+s*.1,base-s*1.1);
  p.quadraticCurveTo(x+s*.06,base-s*.6,x+s*.14,base);p.closePath();
  p.moveTo(x-s*.8,base-s*1.05);p.ellipse(x,base-s*1.05,s*.8,s*.55,0,Math.PI,Math.PI*2);p.closePath();
}
const bobY=(b,now)=>b?Math.sin(now*b.sp+b.ph)*b.amp:0;

function layerColor(L){
  const c=mix(L.night,L.day,SKY.light);
  return mix(c,SKY.hor,L.haze*(.2+.35*(1-SKY.night)));
}
function drawLights(li,now){
  for(const l of SCENE.lights){
    if(l.layer!==li)continue;
    const on=clamp((SKY.night-l.th)/.2,0,1);if(on<=0)continue;
    const fl=l.flick?.8+.2*Math.sin(now*.013+l.x*.7):1,y=l.y+bobY(l.bob,now),a=on*fl;
    if(l.glow){const g=ctx.createRadialGradient(l.x,y,0,l.x,y,l.glow);g.addColorStop(0,rgba(l.c,.38*a));g.addColorStop(1,rgba(l.c,0));
      ctx.fillStyle=g;ctx.fillRect(l.x-l.glow,y-l.glow,l.glow*2,l.glow*2)}
    ctx.fillStyle=rgba(l.c,a);
    if(l.round){ctx.beginPath();ctx.arc(l.x,y,l.w,0,7);ctx.fill()}else ctx.fillRect(l.x-l.w/2,y-l.h/2,l.w,l.h);
  }
}

// ---------- shared sky pieces ----------
const skyStars=Array.from({length:180},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.2+.2,p:Math.random()*7}));
function buildClouds(r){
  SCENE.clouds=Array.from({length:Math.round(5+W/220)},()=>({x:r(),y:.05+r()*.38,s:.6+r()*.9,v:(.000004+r()*.000008)*(r()<.5?1:-1),
    puffs:Array.from({length:5+Math.floor(r()*4)},(_,j)=>[(j-3)*28+r()*14,(r()-.5)*14,26+r()*22,14+r()*10])}));
}
function cloudColor(){
  const base=mix([34,38,70],[255,255,255],SKY.light),warm=1-Math.min(1,Math.abs(SKY.light-.55)*2.2);
  return mix(base,SKY.hor,.25+.35*warm);
}
function drawClouds(now){
  const c=cloudColor();
  for(const cl of SCENE.clouds){
    const x=((cl.x+now*cl.v)%1.4+1.4)%1.4*W-W*.2,y=cl.y*H;
    ctx.fillStyle=rgba(c,.55+.25*SKY.light);
    for(const [dx,dy,rx,ry] of cl.puffs){ctx.beginPath();ctx.ellipse(x+dx*cl.s,y+dy*cl.s,rx*cl.s,ry*cl.s,0,0,7);ctx.fill()}
  }
}
function drawSunMoon(){
  const S=Math.min(W,H),sp=(SKY.hour-5.7)/13.2;
  if(sp>-.06&&sp<1.06){
    const hi=Math.sin(clamp(sp,0,1)*Math.PI),x=W*(.1+.8*sp),y=H*(.8-.64*hi);
    const c=mix([255,120,50],[255,246,215],Math.min(1,hi*1.6)),R=S*.4;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,rgba(c,.5));g.addColorStop(.12,rgba(c,.22));g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
    ctx.fillStyle=rgb(c);ctx.beginPath();ctx.arc(x,y,S*.034,0,7);ctx.fill();
  }
  const mp=((SKY.hour-18.6+24)%24)/11.2;
  if(mp<1.04){
    const hi=Math.sin(clamp(mp,0,1)*Math.PI),x=W*(.14+.72*mp),y=H*(.76-.56*hi),r=S*.028,R=S*.22;
    const g=ctx.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,`rgba(205,220,255,${.22*SKY.stars+.04})`);g.addColorStop(1,'rgba(205,220,255,0)');
    ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
    ctx.fillStyle='#eef0f8';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='rgba(150,160,190,.35)';
    for(const [dx,dy,rr] of [[-.3,-.2,.22],[.25,.3,.16],[.1,-.45,.1],[-.1,.45,.12]]){ctx.beginPath();ctx.arc(x+dx*r,y+dy*r,rr*r,0,7);ctx.fill()}
  }
}
function drawBirds(now){
  if(!SCENE.birds)return;
  const vis=clamp((SKY.light-.45)/.3,0,1);if(vis<=0)return;
  ctx.strokeStyle=rgba(mix([40,40,60],SKY.top,.25),.75*vis);ctx.lineCap='round';
  for(let i=0;i<SCENE.birds;i++){
    const t=((now*.00002*(1+i*.13)+i*.37)%1.3)-.15,x=t*W,y=H*(.16+.05*i+.03*Math.sin(now*.0008+i)),s=(6+i%3*2)*SCENE.birdSize;
    const fl=Math.sin(now*.012+i*2)*s*.6;
    ctx.lineWidth=1.6*SCENE.birdSize;ctx.beginPath();ctx.moveTo(x-s,y-fl);ctx.quadraticCurveTo(x-s*.4,y-s*.3,x,y);ctx.quadraticCurveTo(x+s*.4,y-s*.3,x+s,y-fl);ctx.stroke();
  }
}
const clockEl=document.getElementById('clock');let clockShown='';
function drawScene(now,skyHook){
  skyAt(now);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(SKY.top));g.addColorStop(.55,rgb(mix(SKY.top,SKY.hor,.55)));g.addColorStop(.82,rgb(SKY.hor));g.addColorStop(1,rgb(SKY.hor));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(SKY.stars>.01)for(const s of skyStars){const tw=reduce?.7:.35+.65*Math.abs(Math.sin(now/1400+s.p));
    ctx.fillStyle=`rgba(230,236,255,${tw*.8*SKY.stars})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()}
  drawSunMoon();
  if(skyHook)skyHook(now);
  if(SCENE.sky)SCENE.sky(now);
  drawClouds(now);drawBirds(now);
  SCENE.layers.forEach((L,li)=>{
    if(L.custom){L.custom(now);return}
    const col=layerColor(L);ctx.fillStyle=rgb(col);
    for(const p of L.parts){const by=bobY(p.bob,now);if(by){ctx.save();ctx.translate(0,by);ctx.fill(p.path);ctx.restore()}else ctx.fill(p.path)}
    if(L.draw)L.draw(now,col);
    drawLights(li,now);
  });
  if(SCENE.front)SCENE.front(now);
  if(clockEl){const hh=Math.floor(SKY.hour),mm=Math.floor((SKY.hour%1)*6)*10;
    let ph='Night';for(const [h0,n] of PHASES)if(SKY.hour>=h0)ph=n;
    const txt=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${ph}`;
    if(txt!==clockShown){clockShown=txt;clockEl.textContent=txt}}
}
function smoke(now,x,y,col){                  // chimney smoke puffs
  for(let j=0;j<7;j++){const t=((now*.00035+j/7)%1),px=x+Math.sin(t*6+j)*5*t+t*18,py=y-t*70,r=3+t*12;
    ctx.fillStyle=rgba(col,(1-t)*.22);ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill()}
}

// ---------- Theme: enchanted toxic forest (giant mushrooms, twisted trees, a witch's hut, fog, fireflies) ----------
let chimney=null,fogBands=[],flies=[];
const TOXIC=[[140,255,60],[185,70,255],[40,230,255],[255,60,180],[240,240,40]];
function buildScene(){
  const r=rng(2207);SCENE.layers=[];SCENE.lights=[];SCENE.tint=[30,85,55];SCENE.tintAmt=.22;SCENE.birds=2;SCENE.birdSize=1;
  buildClouds(r);const S=Math.min(W,H);
  // far hills dotted with giant mushrooms
  const p0=new Path2D(),f0=ridge(p0,H*.66,H*.18,W/60,r);
  for(let i=0;i<Math.round(W/220)+3;i++){const x=r()*W;mush(p0,x,f0(x)+4,S*(.07+.06*r()))}
  SCENE.layers.push({parts:[{path:p0}],day:[118,150,124],night:[14,26,22],haze:.75});
  // mid: twisted trees and big glowing mushrooms
  const p1=new Path2D(),f1=ridge(p1,H*.8,H*.07,W/50,r),n=Math.round(W/160)+3;
  for(let i=0;i<n;i++){
    const x=(i+.5)/n*W+(r()-.5)*60,base=f1(x)+6;
    if(r()<.5){ // twisted tree
      const h=S*(.22+.14*r()),w=S*.018,bend=(r()-.5)*S*.08;
      p1.moveTo(x-w,base);p1.quadraticCurveTo(x+bend,base-h*.5,x-w*.4+bend*.6,base-h);p1.lineTo(x+w*.4+bend*.6,base-h);p1.quadraticCurveTo(x+bend+w*2,base-h*.5,x+w,base);p1.closePath();
      for(let b=0;b<3;b++){const by=base-h*(.45+.2*b),dir=b%2?1:-1;p1.moveTo(x+bend*.4,by);p1.quadraticCurveTo(x+dir*S*.05,by-S*.02,x+dir*S*.09,by-S*.06);p1.lineTo(x+dir*S*.088,by-S*.05);p1.quadraticCurveTo(x+dir*S*.04,by-S*.005,x+bend*.4,by+S*.012);p1.closePath()}
      for(let c=0;c<5;c++){const cx=x+bend*.6+(r()-.5)*S*.12,cy=base-h-(r()*S*.06);p1.moveTo(cx+S*.06,cy);p1.ellipse(cx,cy,S*(.04+.03*r()),S*(.03+.02*r()),0,0,7)}
    }else{ // giant mushroom with glowing spots
      const s=S*(.09+.07*r());mush(p1,x,base,s);
      const c=TOXIC[Math.floor(r()*TOXIC.length)];
      for(let k=0;k<5;k++){const a=Math.PI*(1.1+.8*r()),rr=.35+.5*r();
        SCENE.lights.push({layer:1,x:x+Math.cos(a)*s*.8*rr,y:base-s*1.05+Math.sin(a)*s*.55*rr,w:s*(.04+.04*r()),round:1,c,th:r()*.25,glow:s*.25})}
    }
  }
  SCENE.layers.push({parts:[{path:p1}],day:[70,98,76],night:[10,18,15],haze:.4});
  // drifting fog
  fogBands=Array.from({length:5},()=>({y:.62+r()*.3,h:.05+r()*.06,v:.004+r()*.008,ph:r()*W}));
  SCENE.layers.push({custom:now=>{
    const a=.08+.14*(1-SKY.light),c=mix([200,230,210],SKY.hor,.3);
    for(const f of fogBands){const y=f.y*H,h=f.h*H,off=(now*f.v+f.ph)%(W*1.2);
      for(let k=-1;k<3;k++){const x=k*W*.6-off*.5,g=ctx.createRadialGradient(x+W*.3,y,0,x+W*.3,y,W*.35);
        g.addColorStop(0,rgba(c,a));g.addColorStop(1,rgba(c,0));ctx.fillStyle=g;ctx.fillRect(x,y-h*2,W*.6,h*4)}}
  }});
  // near: forest floor with grass, mushroom clusters and a witch's hut
  const p2=new Path2D(),f2=ridge(p2,H*.93,H*.05,W/40,r);
  for(let x=0;x<W;x+=5){const y=f2(x)+3,h=5+r()*12;p2.moveTo(x-2,y);p2.lineTo(x+(r()-.5)*4,y-h);p2.lineTo(x+2,y);p2.closePath()}
  for(let i=0;i<Math.round(W/260)+2;i++){const x=r()*W*.65,base=f2(x)+4;for(let k=0;k<3;k++)mush(p2,x+k*S*.025,base,S*(.025+.02*r()))}
  const hx=W-Math.max(S*.2,W*.14),hb=f2(hx)+6,hw=S*.16,hh=S*.13;
  p2.moveTo(hx-hw*.5,hb);p2.lineTo(hx-hw*.44,hb-hh);p2.lineTo(hx+hw*.48,hb-hh*1.05);p2.lineTo(hx+hw*.52,hb);p2.closePath();
  p2.moveTo(hx-hw*.72,hb-hh*.9);p2.quadraticCurveTo(hx-hw*.1,hb-hh*1.3,hx+hw*.15,hb-hh*2.1);p2.quadraticCurveTo(hx+hw*.25,hb-hh*2.25,hx+hw*.35,hb-hh*2.05);
  p2.quadraticCurveTo(hx+hw*.4,hb-hh*1.3,hx+hw*.75,hb-hh*.95);p2.closePath();
  p2.moveTo(hx+hw*.25,hb-hh*1.3);p2.lineTo(hx+hw*.3,hb-hh*1.9);p2.lineTo(hx+hw*.42,hb-hh*1.88);p2.lineTo(hx+hw*.4,hb-hh*1.2);p2.closePath();
  chimney={x:hx+hw*.36,y:hb-hh*1.92};
  SCENE.lights.push({layer:3,x:hx-hw*.15,y:hb-hh*.6,w:hw*.09,round:1,c:[255,200,90],th:0,glow:hw*.7,flick:1});
  SCENE.lights.push({layer:3,x:hx+hw*.2,y:hb-hh*.35,w:hw*.12,h:hh*.5,c:[255,170,70],th:.15,glow:hw*.5,flick:1});
  SCENE.layers.push({parts:[{path:p2}],day:[42,58,44],night:[7,12,9],haze:.05,draw:now=>smoke(now,chimney.x,chimney.y,mix([150,170,160],SKY.hor,.3))});
  // fireflies at night
  flies=Array.from({length:40},()=>({x:r(),y:.45+r()*.5,p:r()*7,s:.5+r()}));
  SCENE.front=now=>{
    if(SKY.night<.1||reduce)return;
    ctx.globalCompositeOperation='lighter';
    for(const f of flies){const x=(f.x+Math.sin(now*.0003*f.s+f.p)*.03)*W,y=(f.y+Math.cos(now*.0004*f.s+f.p)*.03)*H,a=SKY.night*(.3+.7*Math.abs(Math.sin(now*.003*f.s+f.p)));
      const g=ctx.createRadialGradient(x,y,0,x,y,8);g.addColorStop(0,`rgba(210,255,120,${a})`);g.addColorStop(1,'rgba(210,255,120,0)');ctx.fillStyle=g;ctx.fillRect(x-8,y-8,16,16)}
    ctx.globalCompositeOperation='source-over';
  };
}
buildScene();addEventListener('resize',buildScene);

function drawBg(now){
  drawScene(now,null);
  // forest-floor mushrooms
  for(const s of sprouts){const gr=Math.min(1,(now-s.born)/2000),x=s.x*W,base=H-4,ht=s.h*gr;
    const tw=reduce?.7:.55+.45*Math.abs(Math.sin(now/1300+s.p));
    const R=ht*2.2+4,rg=ctx.createRadialGradient(x,base-ht,0,x,base-ht,R);rg.addColorStop(0,`rgba(${s.g},${.25*tw*gr})`);rg.addColorStop(1,`rgba(${s.g},0)`);
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,base-ht,R,0,7);ctx.fill();
    ctx.save();ctx.translate(x,base);ctx.rotate(s.lean);
    ctx.fillStyle='#ddd3bd';ctx.fillRect(-ht*.09,-ht,ht*.18,ht);
    ctx.fillStyle=s.c;ctx.beginPath();ctx.ellipse(0,-ht,ht*.42,ht*.32,0,Math.PI,0);ctx.closePath();ctx.fill();
    ctx.fillStyle=s.m;ctx.beginPath();ctx.arc(-ht*.15,-ht*1.15,ht*.06,0,7);ctx.arc(ht*.17,-ht*1.08,ht*.05,0,7);ctx.fill();
    ctx.restore()}
  if(reduce)return;
  const mv=.25+.75*SKY.stars;
  for(const m of motes){m.y-=m.v*.0006;if(m.y<0){m.y=1;m.x=Math.random()}
    ctx.fillStyle=`rgba(${m.e},${.38*mv})`;ctx.beginPath();ctx.arc(m.x*W+Math.sin(now/1500+m.v*9)*12,m.y*H,m.r,0,7);ctx.fill()}
}

const countEl=document.getElementById('count');let shown=-1;
let prev=performance.now();
function frame(now){
  const dt=Math.min(50,now-prev);prev=now;
  lifecycle(now,dt);
  const idle=plan(now);
  for(const d of drags)update(d,now,dt,idle);
  if(idle&&!reduce)for(const d of drags){if(d.asc||Math.random()>.35)continue;
    const s=d.seg[Math.floor(Math.random()*Math.min(d.N,8))];
    sparks.push({x:s.x,y:s.y,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,life:.8,c:Math.random()<.5?d.sk.g:d.eye[1]})}
  drags.sort((a,b)=>a.k-b.k);                       // small ones behind, big ones in front
  drawBg(now);
  for(const d of drags){A=d.asc?Math.max(0,1-Math.max(0,d.asc-.35)/.65):1;ctx.globalAlpha=A;
    drawVeil(d,now);drawRoots(d);drawStalk(d,now);drawToxin(d,now);drawCap(d,now)}
  A=1;ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  for(const d of drags){A=d.asc?Math.max(0,1-Math.max(0,d.asc-.35)/.65):1;ctx.globalAlpha=A*(1+(d.asc?Math.min(1,d.asc*3):0));drawAura(d,now);drawAura(d,now);drawEyes(d,now)}
  A=1;ctx.globalAlpha=1;
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vx*=.94;s.vy*=.94;s.life-=dt/700;
    if(s.life<=0){sparks.splice(i,1);continue}
    ctx.fillStyle=`rgba(${s.c},${s.life*.9})`;ctx.beginPath();ctx.arc(s.x,s.y,2.2*s.life+.4,0,7);ctx.fill()}
  if(drags.length!==shown){shown=drags.length;countEl.textContent=`${shown} mushroom${shown>1?'s':''} · limit ${cap()}`}
  ctx.globalCompositeOperation='source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
